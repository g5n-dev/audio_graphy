# ============================================================
# AudioGraphy single-host docker-compose
#
# Supported, mutually-exclusive model profiles:
#   mock                 — core app only; all adapters stay mock
#   models-cpu           — funASR + BGE-M3 CPU + CAM++
#   models-single-gpu    — CPU models + one vLLM + BGE-M3/CLAP on one GPU
#   models-multi-gpu     — CPU models + two vLLMs split across explicit GPUs
#
# Example: docker compose --profile mock up -d
# ============================================================

name: ${COMPOSE_RESOURCE_PREFIX:-audiography}

x-model-security: &model-security
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  mysql:
    image: mysql:8.0.41
    container_name: ${COMPOSE_RESOURCE_PREFIX:-audiography}-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DB:-audiography}
      MYSQL_USER: ${MYSQL_USER:-audiography}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --max-connections=200
      - --innodb-buffer-pool-size=512M
      - --innodb-log-file-size=128M
      - --slow-query-log=ON
      - --long-query-time=1
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
      - ./mysql/conf.d:/etc/mysql/conf.d:ro
    ports:
      # Host 3307 → container 3306 (avoid conflict with locally-installed MySQL on 3306)
      # Backend / adminer connect via the internal docker network on 3306 directly.
      - "${COMPOSE_PRIVATE_BIND_HOST:-127.0.0.1}:${MYSQL_HOST_PORT:-3307}:3306"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - audiography_net

  # Optional shared LLM hot cache. MySQL remains the durable cache source;
  # Redis persistence is deliberately disabled and the app falls back to a
  # bounded process-local cache whenever this profile is absent/unhealthy.
  redis:
    image: redis:8.8.0-alpine
    container_name: ${COMPOSE_RESOURCE_PREFIX:-audiography}-redis
    profiles: ["cache-redis"]
    restart: unless-stopped
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lru
    read_only: true
    tmpfs:
      - /data:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 192M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - audiography_net

  adminer:
    image: adminer:5.3.0
    container_name: ${COMPOSE_RESOURCE_PREFIX:-audiography}-adminer
    profiles: ["mock"]
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${COMPOSE_PRIVATE_BIND_HOST:-127.0.0.1}:${ADMINER_HOST_PORT:-8081}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    networks:
      - audiography_net

  master-key-init:
    build:
      context: ./backend
      dockerfile: Dockerfile
    user: "0:0"
    restart: "no"
    network_mode: "none"
    read_only: true
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "DAC_OVERRIDE", "FOWNER"]
    security_opt:
      - no-new-privileges:true
    volumes:
      - master_key:/run/secrets
      - working_dir:/data/working_dir
    command:
      - python
      - /app/scripts/init_master_key.py
      - /run/secrets/audiography_master.key
      - --state-dir
      - /data/working_dir

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ${COMPOSE_RESOURCE_PREFIX:-audiography}-backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      ADAPTER_MODE: ${ADAPTER_MODE:-mock}
      # Per-adapter modes default to mock. Enable only the models actually
      # present in the selected profile.
      ADAPTER_ASR_MODE: ${ADAPTER_ASR_MODE:-mock}
      ADAPTER_VAD_MODE: ${ADAPTER_VAD_MODE:-mock}
      ADAPTER_LLM_MODE: ${ADAPTER_LLM_MODE:-mock}
      ADAPTER_EMBED_MODE: ${ADAPTER_EMBED_MODE:-mock}
      # Batch VAD has no bundled third-party container: provide an audited
      # compatible endpoint before setting ADAPTER_VAD_MODE=real.
      SILERO_VAD_URL: ${SILERO_VAD_URL:-http://silero-vad-service:8008}
      # Compose service DNS uses container ports, never host-published ports.
      BGE_M3_URL: ${BGE_M3_URL:-http://bge-m3:80}
      OPENAI_BASE_URL_STRONG: ${OPENAI_BASE_URL_STRONG:-http://vllm-strong:8000/v1}
      OPENAI_BASE_URL_WEAK: ${OPENAI_BASE_URL_WEAK:-http://vllm-weak:8000/v1}
      HF_TOKEN: ${HF_TOKEN:-}
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      LLM_HOT_CACHE_BACKEND: ${LLM_HOT_CACHE_BACKEND:-auto}
      REDIS_URL: ${REDIS_URL:-}
      WORKING_DIR: /data/working_dir
    volumes:
      - ./backend:/app
      - working_dir:/data/working_dir
      - master_key:/run/secrets:ro
    ports:
      - "${COMPOSE_APP_BIND_HOST:-127.0.0.1}:${BACKEND_HOST_PORT:-8000}:8000"
    depends_on:
      master-key-init:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
    healthcheck:
      # Readiness, not liveness: /health only proves the process is running.
      # Readiness also reports the database, adapters, writable storage and any
      # subsystem whose wiring failed during startup — so a replica that came up
      # crippled is never marked healthy, and dependents waiting on
      # service_healthy do not start against a half-wired backend.
      test:
        ["CMD-SHELL", "python -c \"import httpx,sys; sys.exit(0 if httpx.get('http://127.0.0.1:8000/health/readiness', timeout=2).status_code==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - audiography_net
    command: >
      sh -c "
        alembic upgrade head &&
        uvicorn audio_graphy.main:app --host 0.0.0.0 --port 8000 --reload --reload-delay 1
      "

  # One-shot: create the first tenant and administrator. A fresh database has no
  # users and there is no self-service registration, so nothing can sign in until
  # this has run. Kept behind its own profile and given no default credentials —
  # a well-known bootstrap account would be worse than no account at all.
  #
  #   BOOTSTRAP_ADMIN_EMAIL=you@example.com \
  #   BOOTSTRAP_ADMIN_PASSWORD='...' \
  #   docker compose --profile bootstrap run --rm bootstrap-admin
  bootstrap-admin:
    profiles: ["bootstrap"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: "no"
    env_file:
      - path: .env
        required: false
    environment:
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      WORKING_DIR: /data/working_dir
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_TENANT_CODE: ${BOOTSTRAP_TENANT_CODE:-default}
    volumes:
      - working_dir:/data/working_dir
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - audiography_net
    command:
      - sh
      - -c
      - >
        python /app/scripts/bootstrap_admin.py
        --email "$$BOOTSTRAP_ADMIN_EMAIL"
        --tenant-code "$$BOOTSTRAP_TENANT_CODE"
        --no-prompt

  tag-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ${COMPOSE_RESOURCE_PREFIX:-audiography}-tag-worker
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      ADAPTER_MODE: ${ADAPTER_MODE:-mock}
      ADAPTER_ASR_MODE: ${ADAPTER_ASR_MODE:-mock}
      ADAPTER_VAD_MODE: ${ADAPTER_VAD_MODE:-mock}
      ADAPTER_LLM_MODE: ${ADAPTER_LLM_MODE:-mock}
      ADAPTER_EMBED_MODE: ${ADAPTER_EMBED_MODE:-mock}
      SILERO_VAD_URL: ${SILERO_VAD_URL:-http://silero-vad-service:8008}
      BGE_M3_URL: ${BGE_M3_URL:-http://bge-m3:80}
      OPENAI_BASE_URL_STRONG: ${OPENAI_BASE_URL_STRONG:-http://vllm-strong:8000/v1}
      OPENAI_BASE_URL_WEAK: ${OPENAI_BASE_URL_WEAK:-http://vllm-weak:8000/v1}
      HF_TOKEN: ${HF_TOKEN:-}
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      LLM_HOT_CACHE_BACKEND: ${LLM_HOT_CACHE_BACKEND:-auto}
      REDIS_URL: ${REDIS_URL:-}
      WORKING_DIR: /data/working_dir
    volumes:
      - ./backend:/app
      - working_dir:/data/working_dir
      - master_key:/run/secrets:ro
    depends_on:
      backend:
        condition: service_healthy
      master-key-init:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
    networks:
      - audiography_net
    command: ["python", "-m", "audio_graphy.tag_worker"]

  # Offline prompt compilation. Shares the queue with tag-worker but claims a
  # disjoint job type, so running one without the other is safe -- prompt_compile
  # jobs simply wait. Behind a profile because a deployment that never opens
  # /prompt-lab has nothing for it to do.
  #
  # Build with EXTRAS="[optimizer]" once a DSPy-native compiler is wired; the
  # builtin and builtin_grounded compilers need nothing beyond the base image.
  optimizer-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        EXTRAS: ${OPTIMIZER_EXTRAS:-}
    container_name: ${COMPOSE_RESOURCE_PREFIX:-audiography}-optimizer-worker
    profiles: ["prompt-lab"]
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      ADAPTER_MODE: ${ADAPTER_MODE:-mock}
      ADAPTER_LLM_MODE: ${ADAPTER_LLM_MODE:-mock}
      OPENAI_BASE_URL_STRONG: ${OPENAI_BASE_URL_STRONG:-http://vllm-strong:8000/v1}
      OPENAI_BASE_URL_WEAK: ${OPENAI_BASE_URL_WEAK:-http://vllm-weak:8000/v1}
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      LLM_HOT_CACHE_BACKEND: ${LLM_HOT_CACHE_BACKEND:-auto}
      REDIS_URL: ${REDIS_URL:-}
      WORKING_DIR: /data/working_dir
    volumes:
      - ./backend:/app
      - working_dir:/data/working_dir
      - master_key:/run/secrets:ro
    depends_on:
      backend:
        condition: service_healthy
      master-key-init:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
    networks:
      - audiography_net
    command: ["python", "-m", "audio_graphy.optimizer_worker"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: ${COMPOSE_RESOURCE_PREFIX:-audiography}-frontend
    restart: unless-stopped
    environment:
      # The browser keeps same-origin /api/v1; only Vite resolves this
      # container-internal upstream through Compose DNS.
      VITE_API_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "${COMPOSE_APP_BIND_HOST:-127.0.0.1}:${FRONTEND_HOST_PORT:-5173}:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # node:22-slim doesn't ship wget/curl — use node's http module directly
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:5173/',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - audiography_net
    command: npm run dev -- --host 0.0.0.0

  # ============================================================
  # Model services. Profiles are mutually exclusive; do not combine them.
  # Host ports are loopback-only and deliberately separated from backend:8000.
  # ============================================================

  # CPU-runnable OpenAI-compatible LLM, for hosts without CUDA.
  # vllm-strong/weak are CUDA-only images and cannot run on an arm64 Mac or
  # any GPU-less host; this serves the same OpenAI contract the backend
  # already speaks, so switching between them is a matter of
  # OPENAI_BASE_URL_* and LLM_*_MODEL, with no code change.
  #
  # On a Mac, prefer an Ollama installed on the host: a container on Docker
  # Desktop gets no Metal access and runs CPU-only, several times slower.
  # Point the backend at http://host.docker.internal:11434/v1 instead and
  # leave this profile unused. It is here for Linux hosts, and for anyone
  # who wants the whole stack inside compose.
  #
  # Under model-security like every other model container. The anchor is only
  # no-new-privileges + cap_drop:ALL; `read_only` is set per service, and never
  # here — so the previous note ("a read-only root breaks it") described a
  # restriction the anchor does not impose. Writing model blobs into its own
  # volume needs neither extra capabilities nor privilege escalation.
  ollama:
    <<: *model-security
    # Pinned like the other model images. `latest` is the one floating tag in
    # this file: two operators running the documented command months apart get
    # different runtimes, and there is no record of which one produced a result.
    image: ollama/ollama:0.12.12
    container_name: ${COMPOSE_RESOURCE_PREFIX:-audiography}-ollama
    profiles: ["models-cpu-llm"]
    restart: unless-stopped
    environment:
      # Keep a loaded model resident; cold-loading per request dominates
      # latency on CPU.
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "${COMPOSE_PRIVATE_BIND_HOST:-127.0.0.1}:${OLLAMA_HOST_PORT:-11434}:11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - audiography_net

  vllm-strong:
    <<: *model-security
    image: vllm/vllm-openai:v0.7.2
    container_name: ${COMPOSE_RESOURCE_PREFIX:-audiography}-vllm-strong
    profiles: ["models-single-gpu", "models-multi-gpu"]
    restart: unless-stopped
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      VLLM_API_KEY: ${OPENAI_API_KEY:-dummy}
    volumes:
      - vllm_cache:/root/.cache/huggingface
    ports:
      - "${COMPOSE_PRIVATE_BIND_HOST:-127.0.0.1}:${VLLM_STRONG_HOST_PORT:-18000}:8000"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status==200 else 1)\""
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 300s
    deploy:
      resources:
        limits:
          memory: ${VLLM_STRONG_MEMORY_LIMIT:-72G}
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${VLLM_STRONG_GPU_ID:-0}"]
              capabilities: [gpu]
    command: >
      --model ${VLLM_STRONG_MODEL:-Qwen/Qwen3.6-27B}
      --served-model-name ${VLLM_STRONG_SERVED_NAME:-qwen3.6-27b}
      --host 0.0.0.0 --port 8000
      --tensor-parallel-size 1
      --gpu-memory-utilization ${VLLM_STRONG_GPU_MEMORY_UTILIZATION:-0.72}
      --enable-prefix-caching
    networks:
      - audiography_net

  vllm-weak:
    <<: *model-security
    image: vllm/vllm-openai:v0.7.2
    container_name: ${COMPOSE_RESOURCE_PREFIX:-audiography}-vllm-weak
    profiles: ["models-multi-gpu"]
    restart: unless-stopped
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      VLLM_API_KEY: ${OPENAI_API_KEY:-dummy}
    volumes:
      - vllm_cache:/root/.cache/huggingface
    ports:
      - "${COMPOSE_PRIVATE_BIND_HOST:-127.0.0.1}:${VLLM_WEAK_HOST_PORT:-18001}:8000"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status==200 else 1)\""
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 300s
    deploy:
      resources:
        limits:
          memory: ${VLLM_WEAK_MEMORY_LIMIT:-80G}
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${VLLM_WEAK_GPU_ID:-1}"]
              capabilities: [gpu]
    command: >
      --model ${VLLM_WEAK_MODEL:-Qwen/Qwen3.6-35B-A3B}
      --served-model-name ${VLLM_WEAK_SERVED_NAME:-qwen3.6-35b-a3b}
      --host 0.0.0.0 --port 8000
      --tensor-parallel-size 1
      --gpu-memory-utilization ${VLLM_WEAK_GPU_MEMORY_UTILIZATION:-0.82}
      --enable-prefix-caching
    networks:
      - audiography_net

  # TEI ships its CPU builds per architecture under *different* tags. The
  # versioned `cpu-<version>` tags are amd64-only — `docker manifest inspect
  # ...:cpu-1.8.2` lists exactly one platform, linux/amd64. On an arm64 host
  # (Apple Silicon, Graviton) that tag still runs under Docker Desktop's x86
  # emulation, but measured on an M3 Max it is 13x slower per request
  # (1 text: 1.04s emulated vs 0.077s native; 32 texts: ~7s vs 1.5s) and warm-up
  # takes ~3min instead of ~20s. Use the native arm64 build instead.
  #
  # Upstream's arm64 CPU build is published only under the rolling
  # `cpu-arm64-latest` tag; `cpu-arm64-sha-<rev>` pins that same image to a
  # commit, so prefer the pinned form. Verified on arm64 (TEI 1.9.3, rev
  # 4150561): BAAI/bge-m3 loads through the ORT backend and /v1/embeddings
  # returns 1024-d vectors.
  #
  #   BGE_M3_CPU_IMAGE=ghcr.io/huggingface/text-embeddings-inference:cpu-arm64-sha-4150561
  bge-m3-cpu:
    <<: *model-security
    image: ${BGE_M3_CPU_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cpu-1.8.2}
    container_name: ${COMPOSE_RESOURCE_PREFIX:-audiography}-bge-m3-cpu
    profiles: ["models-cpu"]
    restart: unless-stopped
    # TEI cannot fetch bge-m3's 2.2GB external-data blob itself (no resume — see
    # bge-m3-cache-init below). Gate startup on the warmer so a clean
    # `docker compose --profile models-cpu up -d` works from an empty volume.
    depends_on:
      bge-m3-cache-init:
        condition: service_completed_successfully
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - tei_cache:/data
    ports:
      - "${COMPOSE_PRIVATE_BIND_HOST:-127.0.0.1}:${BGE_M3_HOST_PORT:-18080}:80"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:80/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      # First start downloads ~2.3GB of bge-m3 weights into tei_cache before the
      # HTTP server binds; 120s only covers a warm cache. Measured cold start on
      # a domestic link: ~40min. Anything that waits on service_healthy would
      # otherwise give up while the download is still in flight.
      start_period: ${BGE_M3_START_PERIOD:-1800s}
    # --max-client-batch-size must be >= the adapter's per-call cap (64, see
    # BGEEmbedAdapter._MAX_BATCH). TEI defaults to 32 and rejects larger
    # batches with HTTP 422 "batch size 64 > maximum allowed batch size 32",
    # which surfaces as EmbedServerError rather than a retryable condition.
    #
    # --max-batch-tokens dominates RSS: the CPU backend runs bge-m3 in float32
    # and pre-sizes its arena from this value. Measured on arm64 — 8192 tokens
    # ≈ 12.7GB resident, 2048 ≈ 4.8GB. Lower it on a memory-constrained host.
    command: >
      --model-id ${BGE_M3_MODEL:-BAAI/bge-m3}
      --max-batch-tokens ${BGE_M3_MAX_BATCH_TOKENS:-8192}
      --max-client-batch-size ${BGE_M3_MAX_CLIENT_BATCH_SIZE:-64}
    networks:
      audiography_net:
        aliases:
          - bge-m3

  # One-shot cache warmer — the reason bge-m3 comes up at all on a real link.
  #
  # TEI's built-in Rust downloader has NO resume. bge-m3 keeps its ONNX weights
  # as external data: `onnx/model.onnx` is a ~0.7MB graph and
  # `onnx/model.onnx_data` is a ~2.2GB blob. When that body is truncated
  # mid-stream TEI logs
  #     WARN Could not download `onnx/model.onnx_data`:
  #          request error: error decoding response body
  # and the next attempt restarts from byte 0 — forever, on a lossy link. Every
  # fallback fails too: BAAI/bge-m3 publishes no model.safetensors (404) and
  # pytorch_model.bin hits the same truncation, so the ORT backend aborts with
  # "cannot get file size: .../onnx/model.onnx_data" and :80 is never bound.
  # No start_period is long enough to fix a transfer that never makes progress.
  #
  # huggingface_hub DOES resume — it streams into `<blob>.incomplete`, retries
  # with a Range request, and only renames to the final `<sha256>` blob name
  # once the file is whole — so this service fills tei_cache first and TEI then
  # finds every artifact locally and downloads nothing.
  #
  # Idempotent and offline-safe: a warm cache short-circuits on a stdlib-only
  # verify with no pip and no network, which is what makes restarts free.
  #   docker compose --profile models-cpu run --rm \
  #     bge-m3-cache-init python /opt/bge-m3/fetch_model.py --verify-only --deep
  # re-hashes every cached blob against its HF blob name (blob names *are* the
  # sha256) to prove the weights on disk are byte-exact.
  bge-m3-cache-init:
    <<: *model-security
    image: ${BGE_M3_CACHE_INIT_IMAGE:-python:3.12-slim}
    container_name: ${COMPOSE_RESOURCE_PREFIX:-audiography}-bge-m3-cache-init
    profiles: ["models-cpu", "models-single-gpu", "models-multi-gpu"]
    restart: "no"
    environment:
      HUGGINGFACE_HUB_CACHE: /data
      HF_HOME: /data
      # Point at a mirror when huggingface.co is the bottleneck, e.g.
      # HF_ENDPOINT=https://hf-mirror.com
      HF_ENDPOINT: ${HF_ENDPOINT:-https://huggingface.co}
      HF_HUB_DOWNLOAD_TIMEOUT: ${HF_HUB_DOWNLOAD_TIMEOUT:-60}
      HF_TOKEN: ${HF_TOKEN:-}
      BGE_M3_MODEL: ${BGE_M3_MODEL:-BAAI/bge-m3}
    volumes:
      - tei_cache:/data
      - ./docker/bge-m3:/opt/bge-m3:ro
    command:
      - sh
      - -ec
      - |
        python /opt/bge-m3/fetch_model.py --verify-only && exit 0
        pip install --quiet --no-cache-dir --disable-pip-version-check 'huggingface_hub>=0.26,<1.0'
        python /opt/bge-m3/fetch_model.py
    networks:
      - audiography_net

  bge-m3-gpu:
    <<: *model-security
    image: ghcr.io/huggingface/text-embeddings-inference:cuda-1.8.2
    container_name: ${COMPOSE_RESOURCE_PREFIX:-audiography}-bge-m3-gpu
    profiles: ["models-single-gpu", "models-multi-gpu"]
    restart: unless-stopped
    # Same tei_cache, same no-resume downloader — warm the cache first.
    depends_on:
      bge-m3-cache-init:
        condition: service_completed_successfully
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - tei_cache:/data
    ports:
      - "${COMPOSE_PRIVATE_BIND_HOST:-127.0.0.1}:${BGE_M3_HOST_PORT:-18080}:80"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:80/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      # Same cold-weight-download caveat as bge-m3-cpu above.
      start_period: ${BGE_M3_START_PERIOD:-1800s}
    deploy:
      resources:
        limits:
          memory: ${BGE_M3_MEMORY_LIMIT:-8G}
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${BGE_M3_GPU_ID:-0}"]
              capabilities: [gpu]
    command: >
      --model-id ${BGE_M3_MODEL:-BAAI/bge-m3}
      --max-batch-tokens ${BGE_M3_MAX_BATCH_TOKENS:-16384}
      --max-client-batch-size ${BGE_M3_MAX_CLIENT_BATCH_SIZE:-64}
    networks:
      audiography_net:
        aliases:
          - bge-m3

  # ASR. Formerly `image: funasr/server:1.0.5` — that repository does not exist
  # on Docker Hub (registry 404s, zero tags), so the service could never start
  # on any architecture. Replaced with a self-built FastAPI wrapper around the
  # funasr Python package running Paraformer-large + FSMN-VAD + CT-Transformer
  # punctuation, which is arm64-native. It serves the same OpenAI-compatible
  # /v1/audio/transcriptions contract, so FUNASR_URL and the ASR adapter are
  # unchanged.
  # Batch VAD. The last stage that had no container -- without it `models-cpu`
  # still segmented with the mock adapter, which derives cut points from file
  # size and has nothing to do with speech.
  #
  # The ONNX weights are operator-supplied, exactly like the streaming overlay:
  # ~2 MB, freely redistributable, but this repository does not ship or vouch
  # for a model binary it does not build. See SILERO_VAD_MODEL_FILE.
  silero-vad-service:
    <<: *model-security
    build:
      context: ./backend
      dockerfile: ../docker/silero-vad-service/Dockerfile
      additional_contexts:
        model_files: ./docker
    container_name: ${COMPOSE_RESOURCE_PREFIX:-audiography}-silero-vad
    profiles: ["models-cpu", "models-single-gpu", "models-multi-gpu"]
    restart: unless-stopped
    environment:
      SILERO_VAD_MODEL_PATH: /models/silero_vad.onnx
      SILERO_VAD_ONNX_THREADS: ${SILERO_VAD_ONNX_THREADS:-1}
      SILERO_VAD_MAX_CONCURRENCY: ${SILERO_VAD_MAX_CONCURRENCY:-1}
      # Must stay below the caller's read timeout (SileroVADAdapter uses 30s):
      # a server that runs past it holds the single concurrency slot for a
      # client that has already given up.
      SILERO_VAD_INFER_TIMEOUT_SEC: ${SILERO_VAD_INFER_TIMEOUT_SEC:-25}
    volumes:
      - type: bind
        source: ${SILERO_VAD_MODEL_FILE:-./models/silero_vad.onnx}
        target: /models/silero_vad.onnx
        read_only: true
    read_only: true
    tmpfs:
      # ffmpeg decodes the upload here before inference. 512m covers an hour of
      # 16 kHz mono PCM (~115 MB) with room for the source container alongside.
      - /tmp:rw,noexec,nosuid,size=512m
    ports:
      - "${COMPOSE_PRIVATE_BIND_HOST:-127.0.0.1}:${SILERO_VAD_HOST_PORT:-18008}:8008"
    healthcheck:
      # Gated on the body, not the status: /health answers 200 with
      # model_loaded=false when the operator has not supplied the ONNX file, and
      # an unhealthy container is the honest signal for that.
      test:
        [
          "CMD-SHELL",
          "python -c \"import json,urllib.request,sys; b=json.load(urllib.request.urlopen('http://127.0.0.1:8008/health',timeout=5)); sys.exit(0 if b.get('model_loaded') else 1)\"",
        ]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 30s
    networks:
      - audiography_net

  funasr:
    <<: *model-security
    build:
      context: ./backend
      dockerfile: ../docker/paraformer-service/Dockerfile
      additional_contexts:
        model_files: ./docker
    container_name: ${COMPOSE_RESOURCE_PREFIX:-audiography}-funasr
    profiles: ["models-cpu", "models-single-gpu", "models-multi-gpu"]
    restart: unless-stopped
    environment:
      # Served-model label echoed back to callers; the pipeline below is what
      # actually runs. Kept as-is so existing .env files stay valid.
      FUNASR_MODEL: ${FUNASR_MODEL:-fun-asr-nano}
      FUNASR_DEVICE: cpu
      FUNASR_LANGUAGE: ${FUNASR_LANGUAGE:-zh}
      # ModelScope ids, all verified to resolve (HTTP 200 on
      # https://modelscope.cn/api/v1/models/<id>).
      PARAFORMER_ASR_MODEL: ${PARAFORMER_ASR_MODEL:-iic/speech_seaco_paraformer_large_asr_nat-zh-cn-16k-common-vocab8404-pytorch}
      PARAFORMER_VAD_MODEL: ${PARAFORMER_VAD_MODEL:-iic/speech_fsmn_vad_zh-cn-16k-common-pytorch}
      PARAFORMER_PUNC_MODEL: ${PARAFORMER_PUNC_MODEL:-iic/punc_ct-transformer_cn-en-common-vocab471067-large}
    ports:
      - "${COMPOSE_PRIVATE_BIND_HOST:-127.0.0.1}:${FUNASR_HOST_PORT:-10095}:8000"
    volumes:
      # ~2 GB of ModelScope weights. A named volume keeps this portable, but on
      # Docker Desktop it lands inside the fixed-size VM disk rather than on the
      # host filesystem — where an exhausted disk shows up only as repeated
      # "[Errno 28] No space left on device" download retries. To keep the
      # weights on the host there instead, swap in a bind mount:
      #   - ${FUNASR_MODEL_CACHE:-funasr_cache}:/home/audiography/.cache/modelscope
      # with FUNASR_MODEL_CACHE=/absolute/host/path
      - funasr_cache:/home/audiography/.cache/modelscope
    read_only: true
    tmpfs:
      # Paraformer decodes long audio into /tmp and numba caches kernels there.
      - /tmp:rw,noexec,nosuid,size=1g
      # modelscope writes an SDK directory to ~/.modelscope, a different path
      # from MODELSCOPE_CACHE. On a read-only root its absence makes the model
      # download fail, and funasr then reports the model as "not registered" —
      # which reads like a bad model id rather than a filesystem problem.
      # tmpfs rather than a named volume because a named volume is created
      # root-owned and this container runs as UID 10001 with no way to chown
      # it. The directory holds only credentials and telemetry state.
      - /home/audiography/.modelscope:rw,noexec,nosuid,size=16m,uid=10001,gid=10001
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/models', timeout=2).read()\""]
      interval: 30s
      timeout: 10s
      retries: 20
      # First boot downloads ~1.5 GB of models from ModelScope.
      start_period: 300s
    networks:
      - audiography_net

  clap-service:
    <<: *model-security
    build:
      context: ./backend
      dockerfile: ../docker/clap-service/Dockerfile
      additional_contexts:
        model_files: ./docker
    container_name: ${COMPOSE_RESOURCE_PREFIX:-audiography}-clap-service
    profiles: ["models-single-gpu", "models-multi-gpu"]
    restart: unless-stopped
    environment:
      CUDA_VISIBLE_DEVICES: "0"
    volumes:
      - clap_cache:/home/audiography/.cache/torch
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
    ports:
      - "${COMPOSE_PRIVATE_BIND_HOST:-127.0.0.1}:${CLAP_HOST_PORT:-18006}:8006"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8006/health', timeout=2).status==200 else 1)\""
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 180s
    deploy:
      resources:
        limits:
          memory: ${CLAP_MEMORY_LIMIT:-4G}
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${CLAP_GPU_ID:-0}"]
              capabilities: [gpu]
    networks:
      - audiography_net

  campplus-service:
    <<: *model-security
    build:
      context: ./backend
      dockerfile: ../docker/campplus-service/Dockerfile
      additional_contexts:
        model_files: ./docker
    container_name: ${COMPOSE_RESOURCE_PREFIX:-audiography}-campplus-service
    profiles: ["models-cpu", "models-single-gpu", "models-multi-gpu"]
    restart: unless-stopped
    environment:
      CAMPPLUS_DEVICE: cpu
      # Load the ASR + speaker pipeline at startup instead of on the first
      # request; a warm load is ~120s, past every caller's timeout. Set to 0 to
      # defer it — /v1/voiceprint/extract works either way and never waits on it.
      CAMPPLUS_ASR_PRELOAD: ${CAMPPLUS_ASR_PRELOAD:-1}
    volumes:
      - campplus_cache:/home/audiography/.cache/modelscope
    read_only: true
    tmpfs:
      # 1g, not 512m: this container now runs the full Paraformer pipeline,
      # which decodes long audio into /tmp alongside the numba kernel cache and
      # torch's inductor scratch. Same size as funasr, which runs the same
      # models. Note tmpfs is RAM — this is on top of the pipeline's ~4 GB RSS.
      - /tmp:rw,noexec,nosuid,size=1g
      # modelscope writes an SDK directory to ~/.modelscope — a different
      # path from MODELSCOPE_CACHE, and on the read-only root without this.
      # Its absence made the download fail and funasr then report the model
      # as "not registered", which reads like a bad model id rather than a
      # filesystem problem. tmpfs rather than a named volume because a named
      # volume is created root-owned and this container runs as UID 10001
      # with no way to chown it. The directory holds only credentials and
      # telemetry state, so losing it on restart costs nothing.
      - /home/audiography/.modelscope:rw,noexec,nosuid,size=16m,uid=10001,gid=10001
    ports:
      - "${COMPOSE_PRIVATE_BIND_HOST:-127.0.0.1}:${CAMPPLUS_HOST_PORT:-18007}:8007"
    healthcheck:
      # Liveness only. /health answers 200 as soon as the SV model is up, which
      # is seconds; the ASR pipeline keeps loading behind it for another ~120s
      # (much longer on a cold model cache). Gating health on the ASR pipeline
      # would mark the container unhealthy whenever diarization is unavailable
      # and take /v1/voiceprint/extract down with it, so readiness for ASR and
      # diarization is published as asr_loaded / spk_loaded in the body instead.
      test:
        - "CMD-SHELL"
        - "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8007/health', timeout=5).status==200 else 1)\""
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s
    networks:
      - audiography_net

volumes:
  ollama_models:
    name: ${COMPOSE_RESOURCE_PREFIX:-audiography}_ollama_models
  mysql_data:
    name: ${COMPOSE_RESOURCE_PREFIX:-audiography}_mysql_data
  working_dir:
    name: ${COMPOSE_RESOURCE_PREFIX:-audiography}_working_dir
  master_key:
    name: ${COMPOSE_RESOURCE_PREFIX:-audiography}_master_key
  # M4 — model cache volumes for real-adapter services.
  vllm_cache:
    name: ${COMPOSE_RESOURCE_PREFIX:-audiography}_vllm_cache
  tei_cache:
    name: ${COMPOSE_RESOURCE_PREFIX:-audiography}_tei_cache
  # M5 — funASR model cache.
  funasr_cache:
    name: ${COMPOSE_RESOURCE_PREFIX:-audiography}_funasr_cache
  # M7 — CLAP / CAM++ model caches.
  clap_cache:
    name: ${COMPOSE_RESOURCE_PREFIX:-audiography}_clap_cache
  campplus_cache:
    name: ${COMPOSE_RESOURCE_PREFIX:-audiography}_campplus_cache

networks:
  audiography_net:
    name: ${COMPOSE_RESOURCE_PREFIX:-audiography}_net
    driver: bridge
