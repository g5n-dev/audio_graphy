# ============================================================
# AudioGraphy single-host docker-compose
#
# Supported, mutually-exclusive model profiles:
#   mock                 — core app only; all adapters stay mock
#   models-cpu           — funASR + BGE-M3 CPU + CAM++
#   models-single-gpu    — CPU models + one vLLM + BGE-M3/CLAP on one GPU
#   models-multi-gpu     — CPU models + two vLLMs split across explicit GPUs
#
# Example: docker compose --profile mock up -d
# ============================================================

name: audiography

x-model-security: &model-security
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  mysql:
    image: mysql:8.0.41
    container_name: audiography-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DB:-audiography}
      MYSQL_USER: ${MYSQL_USER:-audiography}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --max-connections=200
      - --innodb-buffer-pool-size=512M
      - --innodb-log-file-size=128M
      - --slow-query-log=ON
      - --long-query-time=1
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
      - ./mysql/conf.d:/etc/mysql/conf.d:ro
    ports:
      # Host 3307 → container 3306 (avoid conflict with locally-installed MySQL on 3306)
      # Backend / adminer connect via the internal docker network on 3306 directly.
      - "${COMPOSE_PRIVATE_BIND_HOST:-127.0.0.1}:${MYSQL_HOST_PORT:-3307}:3306"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - audiography_net

  adminer:
    image: adminer:5.3.0
    container_name: audiography-adminer
    profiles: ["mock"]
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${COMPOSE_PRIVATE_BIND_HOST:-127.0.0.1}:${ADMINER_HOST_PORT:-8081}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    networks:
      - audiography_net

  master-key-init:
    build:
      context: ./backend
      dockerfile: Dockerfile
    user: "0:0"
    restart: "no"
    network_mode: "none"
    read_only: true
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "DAC_OVERRIDE", "FOWNER"]
    security_opt:
      - no-new-privileges:true
    volumes:
      - master_key:/run/secrets
      - working_dir:/data/working_dir
    command:
      - python
      - /app/scripts/init_master_key.py
      - /run/secrets/audiography_master.key
      - --state-dir
      - /data/working_dir

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: audiography-backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      ADAPTER_MODE: ${ADAPTER_MODE:-mock}
      # Per-adapter modes default to mock. Enable only the models actually
      # present in the selected profile.
      ADAPTER_ASR_MODE: ${ADAPTER_ASR_MODE:-mock}
      ADAPTER_VAD_MODE: ${ADAPTER_VAD_MODE:-mock}
      ADAPTER_LLM_MODE: ${ADAPTER_LLM_MODE:-mock}
      ADAPTER_EMBED_MODE: ${ADAPTER_EMBED_MODE:-mock}
      # Batch VAD has no bundled third-party container: provide an audited
      # compatible endpoint before setting ADAPTER_VAD_MODE=real.
      SILERO_VAD_URL: ${SILERO_VAD_URL:-http://silero-vad.invalid:8000}
      # Compose service DNS uses container ports, never host-published ports.
      BGE_M3_URL: ${BGE_M3_URL:-http://bge-m3:80}
      OPENAI_BASE_URL_STRONG: ${OPENAI_BASE_URL_STRONG:-http://vllm-strong:8000/v1}
      OPENAI_BASE_URL_WEAK: ${OPENAI_BASE_URL_WEAK:-http://vllm-weak:8000/v1}
      HF_TOKEN: ${HF_TOKEN:-}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      WORKING_DIR: /data/working_dir
    volumes:
      - ./backend:/app
      - working_dir:/data/working_dir
      - master_key:/run/secrets:ro
    ports:
      - "${COMPOSE_APP_BIND_HOST:-127.0.0.1}:${BACKEND_HOST_PORT:-8000}:8000"
    depends_on:
      master-key-init:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "python -c \"import httpx,sys; sys.exit(0 if httpx.get('http://127.0.0.1:8000/health', timeout=2).status_code==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - audiography_net
    command: >
      sh -c "
        alembic upgrade head &&
        uvicorn audio_graphy.main:app --host 0.0.0.0 --port 8000 --reload --reload-delay 1
      "

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: audiography-frontend
    restart: unless-stopped
    environment:
      # The browser keeps same-origin /api/v1; only Vite resolves this
      # container-internal upstream through Compose DNS.
      VITE_API_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "${COMPOSE_APP_BIND_HOST:-127.0.0.1}:${FRONTEND_HOST_PORT:-5173}:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # node:22-slim doesn't ship wget/curl — use node's http module directly
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:5173/',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - audiography_net
    command: npm run dev -- --host 0.0.0.0

  # ============================================================
  # Model services. Profiles are mutually exclusive; do not combine them.
  # Host ports are loopback-only and deliberately separated from backend:8000.
  # ============================================================

  vllm-strong:
    <<: *model-security
    image: vllm/vllm-openai:v0.7.2
    container_name: audiography-vllm-strong
    profiles: ["models-single-gpu", "models-multi-gpu"]
    restart: unless-stopped
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      VLLM_API_KEY: ${OPENAI_API_KEY:-dummy}
    volumes:
      - vllm_cache:/root/.cache/huggingface
    ports:
      - "${COMPOSE_PRIVATE_BIND_HOST:-127.0.0.1}:${VLLM_STRONG_HOST_PORT:-18000}:8000"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status==200 else 1)\""
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 300s
    deploy:
      resources:
        limits:
          memory: ${VLLM_STRONG_MEMORY_LIMIT:-72G}
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${VLLM_STRONG_GPU_ID:-0}"]
              capabilities: [gpu]
    command: >
      --model ${VLLM_STRONG_MODEL:-Qwen/Qwen3.6-27B}
      --served-model-name ${VLLM_STRONG_SERVED_NAME:-qwen3.6-27b}
      --host 0.0.0.0 --port 8000
      --tensor-parallel-size 1
      --gpu-memory-utilization ${VLLM_STRONG_GPU_MEMORY_UTILIZATION:-0.72}
    networks:
      - audiography_net

  vllm-weak:
    <<: *model-security
    image: vllm/vllm-openai:v0.7.2
    container_name: audiography-vllm-weak
    profiles: ["models-multi-gpu"]
    restart: unless-stopped
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      VLLM_API_KEY: ${OPENAI_API_KEY:-dummy}
    volumes:
      - vllm_cache:/root/.cache/huggingface
    ports:
      - "${COMPOSE_PRIVATE_BIND_HOST:-127.0.0.1}:${VLLM_WEAK_HOST_PORT:-18001}:8000"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status==200 else 1)\""
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 300s
    deploy:
      resources:
        limits:
          memory: ${VLLM_WEAK_MEMORY_LIMIT:-80G}
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${VLLM_WEAK_GPU_ID:-1}"]
              capabilities: [gpu]
    command: >
      --model ${VLLM_WEAK_MODEL:-Qwen/Qwen3.6-35B-A3B}
      --served-model-name ${VLLM_WEAK_SERVED_NAME:-qwen3.6-35b-a3b}
      --host 0.0.0.0 --port 8000
      --tensor-parallel-size 1
      --gpu-memory-utilization ${VLLM_WEAK_GPU_MEMORY_UTILIZATION:-0.82}
    networks:
      - audiography_net

  bge-m3-cpu:
    <<: *model-security
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8.2
    container_name: audiography-bge-m3-cpu
    profiles: ["models-cpu"]
    restart: unless-stopped
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - tei_cache:/data
    ports:
      - "${COMPOSE_PRIVATE_BIND_HOST:-127.0.0.1}:${BGE_M3_HOST_PORT:-18080}:80"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:80/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    command: >
      --model-id ${BGE_M3_MODEL:-BAAI/bge-m3}
      --max-batch-tokens ${BGE_M3_MAX_BATCH_TOKENS:-8192}
    networks:
      audiography_net:
        aliases:
          - bge-m3

  bge-m3-gpu:
    <<: *model-security
    image: ghcr.io/huggingface/text-embeddings-inference:cuda-1.8.2
    container_name: audiography-bge-m3-gpu
    profiles: ["models-single-gpu", "models-multi-gpu"]
    restart: unless-stopped
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - tei_cache:/data
    ports:
      - "${COMPOSE_PRIVATE_BIND_HOST:-127.0.0.1}:${BGE_M3_HOST_PORT:-18080}:80"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:80/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: ${BGE_M3_MEMORY_LIMIT:-8G}
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${BGE_M3_GPU_ID:-0}"]
              capabilities: [gpu]
    command: >
      --model-id ${BGE_M3_MODEL:-BAAI/bge-m3}
      --max-batch-tokens ${BGE_M3_MAX_BATCH_TOKENS:-16384}
    networks:
      audiography_net:
        aliases:
          - bge-m3

  funasr:
    <<: *model-security
    image: funasr/server:1.0.5
    container_name: audiography-funasr
    profiles: ["models-cpu", "models-single-gpu", "models-multi-gpu"]
    restart: unless-stopped
    environment:
      FUNASR_MODEL: ${FUNASR_MODEL:-fun-asr-nano}
      FUNASR_DEVICE: cpu
    ports:
      - "${COMPOSE_PRIVATE_BIND_HOST:-127.0.0.1}:${FUNASR_HOST_PORT:-10095}:8000"
    volumes:
      - funasr_cache:/root/.cache/funasr
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/models', timeout=2).read()\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - audiography_net

  clap-service:
    <<: *model-security
    build:
      context: ./backend
      dockerfile: ../docker/clap-service/Dockerfile
      additional_contexts:
        model_files: ./docker
    container_name: audiography-clap-service
    profiles: ["models-single-gpu", "models-multi-gpu"]
    restart: unless-stopped
    environment:
      CUDA_VISIBLE_DEVICES: "0"
    volumes:
      - clap_cache:/home/audiography/.cache/torch
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
    ports:
      - "${COMPOSE_PRIVATE_BIND_HOST:-127.0.0.1}:${CLAP_HOST_PORT:-18006}:8006"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8006/health', timeout=2).status==200 else 1)\""
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 180s
    deploy:
      resources:
        limits:
          memory: ${CLAP_MEMORY_LIMIT:-4G}
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${CLAP_GPU_ID:-0}"]
              capabilities: [gpu]
    networks:
      - audiography_net

  campplus-service:
    <<: *model-security
    build:
      context: ./backend
      dockerfile: ../docker/campplus-service/Dockerfile
      additional_contexts:
        model_files: ./docker
    container_name: audiography-campplus-service
    profiles: ["models-cpu", "models-single-gpu", "models-multi-gpu"]
    restart: unless-stopped
    environment:
      CAMPPLUS_DEVICE: cpu
    volumes:
      - campplus_cache:/home/audiography/.cache/modelscope
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
    ports:
      - "${COMPOSE_PRIVATE_BIND_HOST:-127.0.0.1}:${CAMPPLUS_HOST_PORT:-18007}:8007"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8007/health', timeout=2).status==200 else 1)\""
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    networks:
      - audiography_net

volumes:
  mysql_data:
    name: audiography_mysql_data
  working_dir:
    name: audiography_working_dir
  master_key:
    name: audiography_master_key
  # M4 — model cache volumes for real-adapter services.
  vllm_cache:
    name: audiography_vllm_cache
  tei_cache:
    name: audiography_tei_cache
  # M5 — funASR model cache.
  funasr_cache:
    name: audiography_funasr_cache
  # M7 — CLAP / CAM++ model caches.
  clap_cache:
    name: audiography_clap_cache
  campplus_cache:
    name: audiography_campplus_cache

networks:
  audiography_net:
    name: audiography_net
    driver: bridge
