# ============================================================
# AudioGraphy single-host docker-compose (Phase 1 + minimal Phase 3)
#
# Services:
#   mysql        — state layer + vectors (brute-force cosine Phase 1)
#   adminer      — DB web UI (dev-only, port 8081)
#   backend      — FastAPI (uvicorn)
#   frontend     — Vite dev server (port 5173) — replaced by nginx in prod
#
# All model adapters (ASR/LLM/VAD/Embed) ship as MOCK by default
# (ADAPTER_MODE=mock). Real vLLM/funASR services are out-of-scope for this sprint.
#
# Bring up:  docker compose up -d
# Health:    docker compose ps
# Logs:      docker compose logs -f backend
# ============================================================

name: audiography

services:
  mysql:
    image: mysql:8.0.41
    container_name: audiography-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DB:-audiography}
      MYSQL_USER: ${MYSQL_USER:-audiography}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --max-connections=200
      - --innodb-buffer-pool-size=512M
      - --innodb-log-file-size=128M
      - --slow-query-log=ON
      - --long-query-time=1
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
      - ./mysql/conf.d:/etc/mysql/conf.d:ro
    ports:
      # Host 3307 → container 3306 (avoid conflict with locally-installed MySQL on 3306)
      # Backend / adminer connect via the internal docker network on 3306 directly.
      - "3307:3306"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - audiography_net

  adminer:
    image: adminer:5.3.0
    container_name: audiography-adminer
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    networks:
      - audiography_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: audiography-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ADAPTER_MODE: ${ADAPTER_MODE:-mock}
      # M4 per-adapter modes — default "mock" preserves M3 behavior.
      # Set to "real" + `docker compose --profile real up` to enable.
      ADAPTER_ASR_MODE: ${ADAPTER_ASR_MODE:-mock}
      ADAPTER_VAD_MODE: ${ADAPTER_VAD_MODE:-mock}
      ADAPTER_LLM_MODE: ${ADAPTER_LLM_MODE:-mock}
      ADAPTER_EMBED_MODE: ${ADAPTER_EMBED_MODE:-mock}
      # Real-mode endpoints (only consulted when the corresponding mode is "real").
      SILERO_VAD_URL: ${SILERO_VAD_URL:-http://silero-vad:8002}
      BGE_M3_URL: ${BGE_M3_URL:-http://bge-m3:8080}
      OPENAI_BASE_URL_STRONG: ${OPENAI_BASE_URL_STRONG:-http://vllm-strong:8000/v1}
      OPENAI_BASE_URL_WEAK: ${OPENAI_BASE_URL_WEAK:-http://vllm-weak:8001/v1}
      HF_TOKEN: ${HF_TOKEN:-}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      WORKING_DIR: /data/working_dir
    volumes:
      - ./backend:/app
      - working_dir:/data/working_dir
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "python -c \"import httpx,sys; sys.exit(0 if httpx.get('http://127.0.0.1:8000/health', timeout=2).status_code==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - audiography_net
    command: >
      sh -c "
        alembic upgrade head &&
        uvicorn audio_graphy.main:app --host 0.0.0.0 --port 8000 --reload --reload-delay 1
      "

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: audiography-frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE: http://localhost:8000/api/v1
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # node:22-slim doesn't ship wget/curl — use node's http module directly
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:5173/',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - audiography_net
    command: pnpm dev --host 0.0.0.0

  # ============================================================
  # M4 real-adapter services — opt-in via `--profile real`
  #   docker compose --profile real up -d
  #   docker compose --profile real config        # YAML validation
  # ============================================================
  # NOTE: services below are GPU-heavy. CPU-only CI does NOT run them.
  # Silero VAD image (jetresearch/silero-vad-server) is community-maintained
  # and NOT affiliated with the official Silero project — audit before prod.
  # ============================================================

  vllm-strong:
    image: vllm/vllm-openai:v0.7.2
    container_name: audiography-vllm-strong
    profiles: ["real"]
    restart: unless-stopped
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      VLLM_API_KEY: dummy
    volumes:
      - vllm_cache:/root/.cache/huggingface
    ports:
      - "8000:8000"
    healthcheck:
      # Image ships Python but no curl — use urllib.
      test:
        - "CMD-SHELL"
        - "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status==200 else 1)\""
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 300s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: >
      --model Qwen/Qwen3.6-27B
      --served-model-name qwen3.6-27b
      --host 0.0.0.0 --port 8000
      --tensor-parallel-size 1
      --gpu-memory-utilization 0.90
    networks:
      - audiography_net

  vllm-weak:
    image: vllm/vllm-openai:v0.7.2
    container_name: audiography-vllm-weak
    profiles: ["real"]
    restart: unless-stopped
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      VLLM_API_KEY: dummy
    volumes:
      - vllm_cache:/root/.cache/huggingface
    ports:
      - "8001:8000"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status==200 else 1)\""
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 300s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: >
      --model Qwen/Qwen3.6-35B-A3B
      --served-model-name qwen3.6-35b-a3b
      --host 0.0.0.0 --port 8000
      --tensor-parallel-size 1
      --gpu-memory-utilization 0.90
    networks:
      - audiography_net

  silero-vad:
    # Community-maintained, not Silero official. Audit before production use.
    image: jetresearch/silero-vad-server:latest
    container_name: audiography-silero-vad
    profiles: ["real"]
    restart: unless-stopped
    ports:
      - "8002:8000"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status==200 else 1)\""
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - audiography_net

  bge-m3:
    image: ghcr.io/huggingface/text-embeddings-inference:1.5
    container_name: audiography-bge-m3
    profiles: ["real"]
    restart: unless-stopped
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - tei_cache:/data
    ports:
      - "8080:80"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:80/health', timeout=2).status==200 else 1)\""
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: >
      --model-id BAAI/bge-m3
      --max-batch-tokens 16384
    networks:
      - audiography_net

  funasr:
    # Official funASR server image with OpenAI-compatible HTTP API.
    # 镜像 tag 锁定 funasr/server:1.0.5（齐活林 Q1 locked）。
    image: funasr/server:1.0.5
    container_name: audiography-funasr
    profiles: ["real"]
    restart: unless-stopped
    environment:
      FUNASR_MODEL: ${FUNASR_MODEL:-fun-asr-nano}
      FUNASR_DEVICE: ${FUNASR_DEVICE:-cpu}
    ports:
      # Host 10095 → container 8000: backwards compat with M4 host port.
      # Container internal 8000 matches funasr/server:1.0.5 OpenAI-compat default.
      - "10095:8000"
    volumes:
      - funasr_cache:/root/.cache/funasr
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/models', timeout=2).read()\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - audiography_net

volumes:
  mysql_data:
    name: audiography_mysql_data
  working_dir:
    name: audiography_working_dir
  # M4 — model cache volumes for real-adapter services.
  vllm_cache:
    name: audiography_vllm_cache
  tei_cache:
    name: audiography_tei_cache
  # M5 — funASR model cache.
  funasr_cache:
    name: audiography_funasr_cache

networks:
  audiography_net:
    name: audiography_net
    driver: bridge
