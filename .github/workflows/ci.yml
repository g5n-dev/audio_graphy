name: CI

on:
  # Every branch, not just main. Gating only on main meant the branch the work
  # actually happens on was never verified, and the README's CI badge reported
  # on a branch nobody was pushing to.
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: audiography_test
          MYSQL_USER: audiography
          MYSQL_PASSWORD: change-me
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff format check
        working-directory: backend
        run: ruff format --check .

      - name: Ruff lint
        working-directory: backend
        run: ruff check .

      - name: Mypy type check
        working-directory: backend
        run: mypy audio_graphy

      - name: Run tests
        working-directory: backend
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: "3306"
          MYSQL_USER: audiography
          MYSQL_PASSWORD: change-me
          MYSQL_DB: audiography_test
          MODEL_TEST_MYSQL_HOST: 127.0.0.1
          MODEL_TEST_MYSQL_PORT: "3306"
          # The Alembic roundtrip creates and drops its own isolated database.
          # Keep that administrative capability out of the application account.
          MODEL_TEST_MYSQL_USER: root
          MODEL_TEST_MYSQL_PASSWORD: root
          MODEL_TEST_MYSQL_DB: audiography_test
          JWT_SECRET: ci-test-secret-32-chars-minimum!!
          WORKING_DIR: /tmp/audiography_ci
          ADAPTER_MODE: mock
        run: |
          mkdir -p /tmp/audiography_ci
          python -m pytest tests/ -v --cov=audio_graphy --cov-report=term-missing \
            --cov-fail-under=85

      - name: Vector hot-query performance gate
        working-directory: backend
        env:
          RUN_PERF_TESTS: "1"
          VECTOR_PERF_DIM: "128"
          VECTOR_PERF_P95_SECONDS: "0.2"
        run: python -m pytest tests/perf/test_vector_search_perf.py --no-cov -q

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: ESLint
        working-directory: frontend
        run: npm run lint

      # Its own step, before the tests. `npm run build` type-checks as a side
      # effect, but it runs last and its failure reads as a bundling problem;
      # a type error should say so, and should not wait for the test suite.
      - name: TypeScript type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Unit tests
        working-directory: frontend
        run: npm test

      - name: Build and bundle budget
        working-directory: frontend
        run: |
          npm run build
          npm run build:sites

  compose:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment profiles
        run: |
          for profile in mock models-cpu models-single-gpu models-multi-gpu; do
            docker compose --env-file .env.example --profile "$profile" config --quiet
          done
          docker compose -f docker-compose.yml -f docker-compose.streaming-vad.yml --env-file .env.example --profile models-single-gpu config --quiet

      # `config` does not stat bind sources, so an overlay can validate cleanly
      # and still fail at `up` on a path that does not exist. Two kinds of source
      # are legitimately absent from a clone and are not failures: ones compose
      # creates itself (create_host_path), and operator-supplied model files,
      # which must be named in .env.example so the failure is at least
      # documented. Anything else is a path that will break `up`.
      - name: Every bind source either exists or is documented
        run: |
          python3 - <<'EOF'
          import pathlib
          import subprocess
          import sys

          import yaml

          rendered = subprocess.run(
              ["docker", "compose",
               "-f", "docker-compose.yml",
               "-f", "docker-compose.streaming-vad.yml",
               "--env-file", ".env.example",
               "--profile", "models-single-gpu", "config"],
              capture_output=True, text=True, check=True,
          ).stdout
          documented = pathlib.Path(".env.example").read_text(encoding="utf-8")
          root = pathlib.Path.cwd()

          undocumented = []
          for name, service in (yaml.safe_load(rendered).get("services") or {}).items():
              for volume in service.get("volumes") or []:
                  if not isinstance(volume, dict) or volume.get("type") != "bind":
                      continue
                  if (volume.get("bind") or {}).get("create_host_path"):
                      continue
                  source = pathlib.Path(volume["source"])
                  if source.exists():
                      continue
                  try:
                      relative = source.relative_to(root).as_posix()
                  except ValueError:
                      relative = source.as_posix()
                  if relative in documented or source.name in documented:
                      print(f"note: {name} expects operator-supplied {relative}")
                      continue
                  undocumented.append(f"{name}: {relative}")

          for entry in undocumented:
              print(f"::error::bind source does not exist and is undocumented: {entry}")
          sys.exit(1 if undocumented else 0)
          EOF
