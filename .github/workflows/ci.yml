name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: audiography_test
          MYSQL_USER: audiography
          MYSQL_PASSWORD: change-me
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff format check
        working-directory: backend
        run: ruff format --check .

      - name: Ruff lint
        working-directory: backend
        run: ruff check .

      - name: Mypy type check
        working-directory: backend
        run: mypy audio_graphy

      - name: Run tests
        working-directory: backend
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: "3306"
          MYSQL_USER: audiography
          MYSQL_PASSWORD: change-me
          MYSQL_DB: audiography_test
          JWT_SECRET: ci-test-secret-32-chars-minimum!!
          WORKING_DIR: /tmp/audiography_ci
          ADAPTER_MODE: mock
        run: |
          mkdir -p /tmp/audiography_ci
          python -m pytest tests/ -v --cov=audio_graphy --cov-report=term-missing
