# Alembic config for AudioGraphy
# https://alembic.sqlalchemy.org/en/latest/tutorial.html

[alembic]
# Path to migration env (relative to this file)
script_location = alembic

# Template used for new migration files
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for file_template timestamps
timezone = Asia/Shanghai

# Truncate long slugs in filenames
truncate_slug_length = 40

# Output encoding (Python 3 default)
output_encoding = utf-8

# Ini section to pull SQLAlchemy URL from (see alembic/env.py)
# We read from audio_graphy.config.Settings instead — env.py handles it.

[post_write_hooks]
# Run ruff format on generated migration files
hooks = ruff_format ruff_lint
ruff_format.type = console_scripts
ruff_format.entrypoint = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
ruff_lint.type = console_scripts
ruff_lint.entrypoint = ruff
ruff_lint.options = check --fix REVISION_SCRIPT_FILENAME

# Logging
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
