[project]
name = "audio-graphy-backend"
version = "0.1.0"
description = "AudioGraphy backend — store-recording graph retrieval & multi-level tagging"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "AudioGraphy Team" }]
license = { text = "MIT" }

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "aiomysql>=0.2.0",
    "alembic>=1.14.0",
    "greenlet>=3.0.0",
    # Settings / validation
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    # HTTP client (real adapters)
    "httpx>=0.28.0",
    # Auth
    "pyjwt[crypto]>=2.10.0",
    "passlib[bcrypt]>=1.7.4",
    # Graph
    "networkx>=3.4",
    # Scheduling
    "apscheduler>=3.10.4",
    # Embeddings / numerics
    "numpy>=2.1.0",
    # Audio metadata
    "mutagen>=1.47.0",
    # Logging
    "structlog>=24.4.0",
    # Tokenizer (for chunker token budget)
    "tiktoken>=0.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-benchmark>=5.1.0",
    "pytest-mock>=3.14.0",
    "testcontainers[mysql]>=4.8.0",
    "respx>=0.21.1",            # httpx mocking
    "factory-boy>=3.3.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    "ipython>=8.29.0",
]

[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["audio_graphy*"]

# ============================================================
# Ruff — linter + formatter
# ============================================================
[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E", "W",     # pycodestyle
    "F",          # pyflakes
    "I",          # isort
    "B",          # bugbear
    "C4",         # comprehensions
    "UP",         # pyupgrade
    "N",          # pep8-naming
    "SIM",        # simplify
    "ASYNC",      # async lints
    "S",          # bandit (security)
    "T20",        # print warnings
    "RUF",        # ruff-specific
]
ignore = [
    "S101",       # assert in tests is fine
    "B008",       # FastAPI Depends() in defaults is the framework pattern
    "E501",       # line length handled by formatter
    # RUF001/002/003 flag Chinese fullwidth punctuation as "ambiguous" — we are a
    # Chinese-language project, these warnings are noise. Disable globally.
    "RUF001",     # ambiguous unicode character (strings)
    "RUF002",     # ambiguous unicode character (docstrings)
    "RUF003",     # ambiguous unicode character (comments)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "T20", "N802"]   # tests can use prints, snake_case funcs
"alembic/**" = ["N", "E402"]
"audio_graphy/adapters/mock_data/**" = ["S"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# ============================================================
# mypy — strict type checking
# ============================================================
[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "apscheduler.*",
    "networkx.*",
    "mutagen.*",
    "passlib.*",
    "testcontainers.*",
    "respx.*",
]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ============================================================
# pytest
# ============================================================
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--asyncio-mode=auto",
    "--cov=audio_graphy",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-report=xml:coverage.xml",
    "--cov-fail-under=85",
]
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: unit tests (single module, mocked deps)",
    "integration: integration tests (real DB via testcontainers, mocked adapters)",
    "contract: adapter protocol conformance tests",
    "perf: performance tests (have explicit budgets)",
    "e2e: end-to-end tests requiring full stack",
    "slow: tests that take >1s",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:apscheduler.*",
    "ignore::DeprecationWarning:passlib.*",
]

# ============================================================
# Coverage
# ============================================================
[tool.coverage.run]
source = ["audio_graphy"]
branch = true
omit = [
    "*/tests/*",
    "*/alembic/*",
    "*/audio_graphy/adapters/mock_data/*",
    "*/audio_graphy/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@overload",
    "\\.\\.\\.",
]
