<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" viewBox="0 0 1000 540"><defs><marker id="t-arrow" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#165DFF" d="M0,0 L10,5 L0,10 z"/></marker><marker id="t-arrow-orange" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#FF7D00" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect width="1000" height="540" fill="#FAFBFC"/><text x="500" y="32" fill="#1D2129" font-size="20" font-weight="700" text-anchor="middle">标签版本化与增量重算（Tag Versioning &amp; Incremental Recompute）</text><text x="500" y="52" fill="#86909C" font-size="12" text-anchor="middle">版本是地基 · diff 驱动最小重算 · LLM 缓存驱动的幂等重打</text><rect width="280" height="290" x="30" y="80" fill="#FFF1F0" stroke="#F53F3F" stroke-width="1.5" rx="8"/><text x="170" y="103" fill="#A8071A" font-size="13" font-weight="700" text-anchor="middle">Layer 1 · tag_facts</text><text x="170" y="120" fill="#86909C" font-size="10" text-anchor="middle">append-only · 不可变 · 版本化真相源</text><rect width="250" height="100" x="45" y="135" fill="#FFF" stroke="#F53F3F" rx="4"/><text x="55" y="153" fill="#1D2129" font-size="10" font-weight="700">(recording_id, tag_path, value, version, ...)</text><text x="55" y="172" fill="#0F7A2E" font-family="ui-monospace, Menlo, monospace" font-size="10">(R001, 接待.开场, 标准, v=1,</text><text x="55" y="187" fill="#0F7A2E" font-family="ui-monospace, Menlo, monospace" font-size="10">prompt_v=1, hash=abc..., src=llm)</text><text x="55" y="207" fill="#165DFF" font-family="ui-monospace, Menlo, monospace" font-size="10">(R001, 接待.开场, 标准, v=2,</text><text x="55" y="222" fill="#165DFF" font-family="ui-monospace, Menlo, monospace" font-size="10">prompt_v=2, hash=def..., src=llm)</text><rect width="250" height="60" x="45" y="245" fill="#FFF7E8" stroke="#FF7D00" rx="4"/><text x="55" y="263" fill="#7A4D00" font-size="10" font-weight="700">关键键：prompt_version</text><text x="55" y="280" fill="#86909C" font-size="10">回答&quot;此标签在什么规则下判出来&quot;</text><text x="55" y="294" fill="#86909C" font-size="10">据此圈 dirty · diff · 复现任意版本</text><rect width="250" height="45" x="45" y="315" fill="#F7F8FA" stroke="#E5E6EB" rx="4"/><text x="55" y="332" fill="#4E5969" font-size="10">完整配方字段：</text><text x="55" y="346" fill="#4E5969" font-family="ui-monospace, Menlo, monospace" font-size="9">value·prompt_version·model_version·source·input_hash·confidence</text><rect width="280" height="290" x="340" y="80" fill="#E8F3FF" stroke="#165DFF" stroke-width="1.5" rx="8"/><text x="480" y="103" fill="#0E42D2" font-size="13" font-weight="700" text-anchor="middle">Layer 2 · tag_current</text><text x="480" y="120" fill="#86909C" font-size="10" text-anchor="middle">当前生效视图 · MAX(version) per (rec, tag_path)</text><rect width="250" height="100" x="355" y="135" fill="#FFF" stroke="#165DFF" rx="4"/><text x="365" y="155" fill="#1D2129" font-family="ui-monospace, Menlo, monospace" font-size="10">R001 · 接待.开场 = 标准 [v2]</text><text x="365" y="172" fill="#1D2129" font-family="ui-monospace, Menlo, monospace" font-size="10">R001 · 接待.报价 = 已报 [v2]</text><text x="365" y="189" fill="#1D2129" font-family="ui-monospace, Menlo, monospace" font-size="10">R001 · 接待.试乘试驾 = 未试 [v1]</text><text x="365" y="206" fill="#1D2129" font-family="ui-monospace, Menlo, monospace" font-size="10">R002 · 接待.开场 = 简洁 [v2]</text><text x="365" y="223" fill="#1D2129" font-family="ui-monospace, Menlo, monospace" font-size="10">...</text><rect width="250" height="60" x="355" y="245" fill="#F7F8FA" stroke="#E5E6EB" rx="4"/><text x="365" y="263" fill="#1D2129" font-size="10" font-weight="700">查询语义</text><text x="365" y="280" fill="#86909C" font-size="10">SELECT ... FROM tag_facts</text><text x="365" y="294" fill="#86909C" font-size="10">WHERE version = (SELECT MAX(version) ...)</text><rect width="250" height="45" x="355" y="315" fill="#E8FFEA" stroke="#00B42A" rx="4"/><text x="365" y="332" fill="#0F7A2E" font-size="10" font-weight="700">物化策略</text><text x="365" y="346" fill="#86909C" font-size="10">触发器 / 定时刷新 / 查询时算</text><rect width="320" height="290" x="650" y="80" fill="#E8FFEA" stroke="#00B42A" stroke-width="1.5" rx="8"/><text x="810" y="103" fill="#0F7A2E" font-size="13" font-weight="700" text-anchor="middle">Layer 3 · tag_stats（物化聚合）</text><text x="810" y="120" fill="#86909C" font-size="10" text-anchor="middle">多级标签计数/分布 · 增量刷新 · 报表/看板读这个</text><rect width="290" height="100" x="665" y="135" fill="#FFF" stroke="#00B42A" rx="4"/><text x="675" y="153" fill="#1D2129" font-family="ui-monospace, Menlo, monospace" font-size="10">tenant · store · tag_path · value · count</text><text x="675" y="170" fill="#1D2129" font-family="ui-monospace, Menlo, monospace" font-size="10">华东 · 上海店 · 接待.开场=标准 → 42</text><text x="675" y="187" fill="#1D2129" font-family="ui-monospace, Menlo, monospace" font-size="10">华东 · 上海店 · 接待.开场=简洁 → 18</text><text x="675" y="204" fill="#1D2129" font-family="ui-monospace, Menlo, monospace" font-size="10">华东 · 杭州店 · 接待.开场=标准 → 35</text><text x="675" y="221" fill="#1D2129" font-family="ui-monospace, Menlo, monospace" font-size="10">华南 · 深圳店 · 接待.试乘试驾=已 → 28</text><rect width="290" height="60" x="665" y="245" fill="#F7F8FA" stroke="#E5E6EB" rx="4"/><text x="675" y="263" fill="#1D2129" font-size="10" font-weight="700">增量刷新</text><text x="675" y="280" fill="#86909C" font-size="10">tag_current 变化 → 找祖先链 → tag_stats</text><text x="675" y="294" fill="#86909C" font-size="10">-old +new delta（不全量重算）</text><rect width="290" height="45" x="665" y="315" fill="#FFF7E8" stroke="#FF7D00" rx="4"/><text x="675" y="332" fill="#7A4D00" font-size="10" font-weight="700">下钻维度</text><text x="675" y="346" fill="#86909C" font-size="10">tenant → brand → region → store → agent → tag_path</text><line x1="310" x2="340" y1="180" y2="180" stroke="#F53F3F" stroke-width="2" marker-end="url(#t-arrow)"/><line x1="620" x2="650" y1="180" y2="180" stroke="#165DFF" stroke-width="2" marker-end="url(#t-arrow)"/><text x="325" y="170" fill="#A8071A" font-size="9" text-anchor="middle">聚合</text><text x="635" y="170" fill="#0E42D2" font-size="9" text-anchor="middle">下钻/统计</text><text x="500" y="400" fill="#1D2129" font-size="14" font-weight="700" text-anchor="middle">重算策略矩阵（Recompute Strategy Matrix）</text><rect width="940" height="110" x="30" y="420" fill="#F7F8FA" stroke="#E5E6EB" rx="8"/><g fill="#1D2129" font-size="10"><text x="40" y="442" font-weight="700">单条人工修正</text><text x="40" y="458" fill="#86909C">1 条 recording · 增量 delta（−旧 +新）· 标脏祖先路径</text><text x="40" y="478" font-weight="700">prompt/规则升级（批量重打）</text><text x="40" y="494" fill="#86909C">version-gate：重打→diff v2 vs v1→只 commit 变化→标 dirty→增量聚合</text><text x="40" y="514" font-weight="700">滞后数据到达</text><text x="40" y="530" fill="#86909C">仅重算该 time_window 的聚合</text><text x="500" y="442" font-weight="700">分类法/层级变更</text><text x="500" y="458" fill="#86909C">全量重算（切新 version · 罕见批跑）</text><text x="500" y="478" font-weight="700">LLM 缓存驱动的幂等重打（关键福利）</text><text x="500" y="494" fill="#0F7A2E">同 prompt 重打 → MD5(model,messages) 命中缓存 → 0 token → 免费</text><text x="500" y="514" fill="#0F7A2E">改 prompt 重打 → 仅新 prompt 重算 · diff 再压&quot;真变化&quot;</text><text x="500" y="530" fill="#F53F3F">⚠ cache 文件膨胀 → 定期清/切工作目录</text></g></svg>