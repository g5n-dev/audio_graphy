<svg viewBox="0 0 1000 540" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="t-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#165DFF"/></marker>
    <marker id="t-arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#FF7D00"/></marker>
  </defs>
  <rect width="1000" height="540" fill="#FAFBFC"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#1D2129">标签版本化与增量重算（Tag Versioning &amp; Incremental Recompute）</text>
  <text x="500" y="52" text-anchor="middle" font-size="12" fill="#86909C">版本是地基 · diff 驱动最小重算 · LLM 缓存驱动的幂等重打</text>

  <!-- Layer 1: tag_facts -->
  <rect x="30" y="80" width="280" height="290" rx="8" fill="#FFF1F0" stroke="#F53F3F" stroke-width="1.5"/>
  <text x="170" y="103" text-anchor="middle" font-size="13" font-weight="700" fill="#A8071A">Layer 1 · tag_facts</text>
  <text x="170" y="120" text-anchor="middle" font-size="10" fill="#86909C">append-only · 不可变 · 版本化真相源</text>

  <rect x="45" y="135" width="250" height="100" rx="4" fill="#FFFFFF" stroke="#F53F3F"/>
  <text x="55" y="153" font-size="10" font-weight="700" fill="#1D2129">(recording_id, tag_path, value, version, ...)</text>
  <text x="55" y="172" font-size="10" font-family="ui-monospace, Menlo, monospace" fill="#0F7A2E">(R001, 接待.开场, 标准, v=1,</text>
  <text x="55" y="187" font-size="10" font-family="ui-monospace, Menlo, monospace" fill="#0F7A2E"> prompt_v=1, hash=abc..., src=llm)</text>
  <text x="55" y="207" font-size="10" font-family="ui-monospace, Menlo, monospace" fill="#165DFF">(R001, 接待.开场, 标准, v=2,</text>
  <text x="55" y="222" font-size="10" font-family="ui-monospace, Menlo, monospace" fill="#165DFF"> prompt_v=2, hash=def..., src=llm)</text>

  <rect x="45" y="245" width="250" height="60" rx="4" fill="#FFF7E8" stroke="#FF7D00"/>
  <text x="55" y="263" font-size="10" font-weight="700" fill="#7A4D00">关键键：prompt_version</text>
  <text x="55" y="280" font-size="10" fill="#86909C">回答"此标签在什么规则下判出来"</text>
  <text x="55" y="294" font-size="10" fill="#86909C">据此圈 dirty · diff · 复现任意版本</text>

  <rect x="45" y="315" width="250" height="45" rx="4" fill="#F7F8FA" stroke="#E5E6EB"/>
  <text x="55" y="332" font-size="10" fill="#4E5969">完整配方字段：</text>
  <text x="55" y="346" font-size="9" font-family="ui-monospace, Menlo, monospace" fill="#4E5969">value·prompt_version·model_version·source·input_hash·confidence</text>

  <!-- Layer 2: tag_current -->
  <rect x="340" y="80" width="280" height="290" rx="8" fill="#E8F3FF" stroke="#165DFF" stroke-width="1.5"/>
  <text x="480" y="103" text-anchor="middle" font-size="13" font-weight="700" fill="#0E42D2">Layer 2 · tag_current</text>
  <text x="480" y="120" text-anchor="middle" font-size="10" fill="#86909C">当前生效视图 · MAX(version) per (rec, tag_path)</text>

  <rect x="355" y="135" width="250" height="100" rx="4" fill="#FFFFFF" stroke="#165DFF"/>
  <text x="365" y="155" font-size="10" font-family="ui-monospace, Menlo, monospace" fill="#1D2129">R001 · 接待.开场    = 标准   [v2]</text>
  <text x="365" y="172" font-size="10" font-family="ui-monospace, Menlo, monospace" fill="#1D2129">R001 · 接待.报价    = 已报   [v2]</text>
  <text x="365" y="189" font-size="10" font-family="ui-monospace, Menlo, monospace" fill="#1D2129">R001 · 接待.试乘试驾 = 未试   [v1]</text>
  <text x="365" y="206" font-size="10" font-family="ui-monospace, Menlo, monospace" fill="#1D2129">R002 · 接待.开场    = 简洁   [v2]</text>
  <text x="365" y="223" font-size="10" font-family="ui-monospace, Menlo, monospace" fill="#1D2129">...</text>

  <rect x="355" y="245" width="250" height="60" rx="4" fill="#F7F8FA" stroke="#E5E6EB"/>
  <text x="365" y="263" font-size="10" font-weight="700" fill="#1D2129">查询语义</text>
  <text x="365" y="280" font-size="10" fill="#86909C">SELECT ... FROM tag_facts</text>
  <text x="365" y="294" font-size="10" fill="#86909C">WHERE version = (SELECT MAX(version) ...)</text>

  <rect x="355" y="315" width="250" height="45" rx="4" fill="#E8FFEA" stroke="#00B42A"/>
  <text x="365" y="332" font-size="10" font-weight="700" fill="#0F7A2E">物化策略</text>
  <text x="365" y="346" font-size="10" fill="#86909C">触发器 / 定时刷新 / 查询时算</text>

  <!-- Layer 3: tag_stats -->
  <rect x="650" y="80" width="320" height="290" rx="8" fill="#E8FFEA" stroke="#00B42A" stroke-width="1.5"/>
  <text x="810" y="103" text-anchor="middle" font-size="13" font-weight="700" fill="#0F7A2E">Layer 3 · tag_stats（物化聚合）</text>
  <text x="810" y="120" text-anchor="middle" font-size="10" fill="#86909C">多级标签计数/分布 · 增量刷新 · 报表/看板读这个</text>

  <rect x="665" y="135" width="290" height="100" rx="4" fill="#FFFFFF" stroke="#00B42A"/>
  <text x="675" y="153" font-size="10" font-family="ui-monospace, Menlo, monospace" fill="#1D2129">tenant · store · tag_path · value · count</text>
  <text x="675" y="170" font-size="10" font-family="ui-monospace, Menlo, monospace" fill="#1D2129">华东 · 上海店 · 接待.开场=标准  → 42</text>
  <text x="675" y="187" font-size="10" font-family="ui-monospace, Menlo, monospace" fill="#1D2129">华东 · 上海店 · 接待.开场=简洁  → 18</text>
  <text x="675" y="204" font-size="10" font-family="ui-monospace, Menlo, monospace" fill="#1D2129">华东 · 杭州店 · 接待.开场=标准  → 35</text>
  <text x="675" y="221" font-size="10" font-family="ui-monospace, Menlo, monospace" fill="#1D2129">华南 · 深圳店 · 接待.试乘试驾=已 → 28</text>

  <rect x="665" y="245" width="290" height="60" rx="4" fill="#F7F8FA" stroke="#E5E6EB"/>
  <text x="675" y="263" font-size="10" font-weight="700" fill="#1D2129">增量刷新</text>
  <text x="675" y="280" font-size="10" fill="#86909C">tag_current 变化 → 找祖先链 → tag_stats</text>
  <text x="675" y="294" font-size="10" fill="#86909C">-old +new delta（不全量重算）</text>

  <rect x="665" y="315" width="290" height="45" rx="4" fill="#FFF7E8" stroke="#FF7D00"/>
  <text x="675" y="332" font-size="10" font-weight="700" fill="#7A4D00">下钻维度</text>
  <text x="675" y="346" font-size="10" fill="#86909C">tenant → brand → region → store → agent → tag_path</text>

  <!-- 流向箭头 -->
  <line x1="310" y1="180" x2="340" y2="180" stroke="#F53F3F" stroke-width="2" marker-end="url(#t-arrow)"/>
  <line x1="620" y1="180" x2="650" y2="180" stroke="#165DFF" stroke-width="2" marker-end="url(#t-arrow)"/>

  <text x="325" y="170" text-anchor="middle" font-size="9" fill="#A8071A">聚合</text>
  <text x="635" y="170" text-anchor="middle" font-size="9" fill="#0E42D2">下钻/统计</text>

  <!-- 重算策略矩阵 -->
  <text x="500" y="400" text-anchor="middle" font-size="14" font-weight="700" fill="#1D2129">重算策略矩阵（Recompute Strategy Matrix）</text>

  <rect x="30" y="420" width="940" height="110" rx="8" fill="#F7F8FA" stroke="#E5E6EB"/>
  <g font-size="10" fill="#1D2129">
    <text x="40" y="442" font-weight="700">单条人工修正</text>
    <text x="40" y="458" fill="#86909C">1 条 recording · 增量 delta（−旧 +新）· 标脏祖先路径</text>

    <text x="40" y="478" font-weight="700">prompt/规则升级（批量重打）</text>
    <text x="40" y="494" fill="#86909C">version-gate：重打→diff v2 vs v1→只 commit 变化→标 dirty→增量聚合</text>

    <text x="40" y="514" font-weight="700">滞后数据到达</text>
    <text x="40" y="530" fill="#86909C">仅重算该 time_window 的聚合</text>

    <text x="500" y="442" font-weight="700">分类法/层级变更</text>
    <text x="500" y="458" fill="#86909C">全量重算（切新 version · 罕见批跑）</text>

    <text x="500" y="478" font-weight="700">LLM 缓存驱动的幂等重打（关键福利）</text>
    <text x="500" y="494" fill="#0F7A2E">同 prompt 重打 → MD5(model,messages) 命中缓存 → 0 token → 免费</text>
    <text x="500" y="514" fill="#0F7A2E">改 prompt 重打 → 仅新 prompt 重算 · diff 再压"真变化"</text>
    <text x="500" y="530" fill="#F53F3F">⚠ cache 文件膨胀 → 定期清/切工作目录</text>
  </g>
</svg>
