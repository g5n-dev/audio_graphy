<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" viewBox="0 0 1000 560"><defs><marker id="i-arrow" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#165DFF" d="M0,0 L10,5 L0,10 z"/></marker><marker id="i-arrow-gray" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#4E5969" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect width="1000" height="560" fill="#FAFBFC"/><text x="500" y="32" fill="#1D2129" font-size="20" font-weight="700" text-anchor="middle">索引数据流（Indexing Dataflow）</text><text x="500" y="52" fill="#86909C" font-size="12" text-anchor="middle">绿=新增/替换 · 红=砍掉 · 蓝=保留自 VideoRAG · 紫=服务调用</text><g font-size="11"><rect width="120" height="60" x="20" y="90" fill="#FFF7E8" stroke="#FF7D00" stroke-width="1.5" rx="8"/><text x="80" y="112" fill="#1D2129" font-weight="700" text-anchor="middle">① 录音接入</text><text x="80" y="128" fill="#86909C" text-anchor="middle">watchdog / 上传</text><text x="80" y="142" fill="#86909C" text-anchor="middle">写 recordings 行</text><rect width="120" height="60" x="160" y="90" fill="#E8FFEA" stroke="#00B42A" stroke-width="1.5" rx="8"/><text x="220" y="112" fill="#0F7A2E" font-weight="700" text-anchor="middle">② VAD 切分 🆕</text><text x="220" y="128" fill="#86909C" text-anchor="middle">Silero 检测语音段</text><text x="220" y="142" fill="#86909C" text-anchor="middle">跳静音 → ASR 有效</text><rect width="120" height="60" x="300" y="90" fill="#E8FFEA" stroke="#00B42A" stroke-width="1.5" rx="8"/><text x="360" y="112" fill="#0F7A2E" font-weight="700" text-anchor="middle">③ ASR 转写 🆕</text><text x="360" y="128" fill="#86909C" text-anchor="middle">funASR（中文强）</text><text x="360" y="142" fill="#86909C" text-anchor="middle">每段 → transcript</text><rect width="120" height="60" x="440" y="90" fill="#F5E8FF" stroke="#722ED1" stroke-dasharray="3 2" stroke-width="1.5" rx="8"/><text x="500" y="112" fill="#5B1DAB" font-weight="700" text-anchor="middle">④ 声纹 (可选) 🆕</text><text x="500" y="128" fill="#86909C" text-anchor="middle">CAM++ 说话人分离</text><text x="500" y="142" fill="#86909C" text-anchor="middle">跨录音链接</text><rect width="120" height="60" x="580" y="90" fill="#E8F3FF" stroke="#165DFF" stroke-width="1.5" rx="8"/><text x="640" y="112" fill="#0E42D2" font-weight="700" text-anchor="middle">⑤ chunk 打包</text><text x="640" y="128" fill="#86909C" text-anchor="middle">按 token 预算打包</text><text x="640" y="142" fill="#86909C" text-anchor="middle">+ 三级溯源链</text><rect width="120" height="60" x="720" y="90" fill="#E8F3FF" stroke="#165DFF" stroke-width="1.5" rx="8"/><text x="780" y="112" fill="#0E42D2" font-weight="700" text-anchor="middle">⑥ bge-m3 向量</text><text x="780" y="128" fill="#86909C" text-anchor="middle">chunk → chunk_emb</text><text x="780" y="142" fill="#86909C" text-anchor="middle">→ MySQL vectors</text><rect width="120" height="60" x="860" y="90" fill="#E8F3FF" stroke="#165DFF" stroke-width="1.5" rx="8"/><text x="920" y="112" fill="#0E42D2" font-weight="700" text-anchor="middle">⑦ 实体抽取</text><text x="920" y="128" fill="#86909C" text-anchor="middle">中文 prompt（强 LLM）</text><text x="920" y="142" fill="#86909C" text-anchor="middle">+ Gleaning 补抽</text><rect width="120" height="60" x="20" y="200" fill="#E8F3FF" stroke="#165DFF" stroke-width="1.5" rx="8"/><text x="80" y="222" fill="#0E42D2" font-weight="700" text-anchor="middle">⑧ 向量编码</text><text x="80" y="238" fill="#86909C" text-anchor="middle">entity → entity_emb</text><text x="80" y="252" fill="#86909C" text-anchor="middle">→ MySQL vectors</text><rect width="120" height="60" x="160" y="200" fill="#E8F3FF" stroke="#165DFF" stroke-width="1.5" rx="8"/><text x="220" y="222" fill="#0E42D2" font-weight="700" text-anchor="middle">⑨ 图谱合并</text><text x="220" y="238" fill="#86909C" text-anchor="middle">按名字去重合并</text><text x="220" y="252" fill="#86909C" text-anchor="middle">类型 Counter 投票</text><rect width="120" height="60" x="300" y="200" fill="#FFF7E8" stroke="#FF7D00" stroke-width="1.5" rx="8"/><text x="360" y="222" fill="#7A4D00" font-weight="700" text-anchor="middle">⑩ 中文归一 🆕</text><text x="360" y="238" fill="#86909C" text-anchor="middle">别名表 / 编辑距离</text><text x="360" y="252" fill="#86909C" text-anchor="middle">消近重名实体</text><rect width="120" height="60" x="440" y="200" fill="#E8F3FF" stroke="#165DFF" stroke-width="1.5" rx="8"/><text x="500" y="222" fill="#0E42D2" font-weight="700" text-anchor="middle">⑪ 边打标</text><text x="500" y="238" fill="#86909C" text-anchor="middle">借鉴 Graphify:</text><text x="500" y="252" fill="#86909C" text-anchor="middle">EXTRACTED/INFERRED</text><rect width="120" height="60" x="580" y="200" fill="#E8F3FF" stroke="#165DFF" stroke-width="1.5" rx="8"/><text x="640" y="222" fill="#0E42D2" font-weight="700" text-anchor="middle">⑫ Leiden 社区</text><text x="640" y="238" fill="#86909C" text-anchor="middle">基于图拓扑聚类</text><text x="640" y="252" fill="#86909C" text-anchor="middle">无 embedding</text><rect width="120" height="60" x="720" y="200" fill="#E8F3FF" stroke="#165DFF" stroke-width="1.5" rx="8"/><text x="780" y="222" fill="#0E42D2" font-weight="700" text-anchor="middle">⑬ flush 落盘</text><text x="780" y="238" fill="#86909C" text-anchor="middle">index_done_callback</text><text x="780" y="252" fill="#86909C" text-anchor="middle">生命周期点 checkpoint</text><rect width="120" height="60" x="860" y="200" fill="#E8FFEA" stroke="#00B42A" stroke-width="1.5" rx="8"/><text x="920" y="222" fill="#0F7A2E" font-weight="700" text-anchor="middle">⑭ 状态回写 🆕</text><text x="920" y="238" fill="#86909C" text-anchor="middle">recordings.status</text><text x="920" y="252" fill="#86909C" text-anchor="middle">= indexed</text><rect width="120" height="60" x="20" y="310" fill="#FFF7E8" stroke="#FF7D00" stroke-width="1.5" rx="8"/><text x="80" y="332" fill="#7A4D00" font-weight="700" text-anchor="middle">⑮ 标签抽取 🆕</text><text x="80" y="348" fill="#86909C" text-anchor="middle">弱 LLM 判多级标签</text><text x="80" y="362" fill="#86909C" text-anchor="middle">输入 hash</text><rect width="120" height="60" x="160" y="310" fill="#FFF7E8" stroke="#FF7D00" stroke-width="1.5" rx="8"/><text x="220" y="332" fill="#7A4D00" font-weight="700" text-anchor="middle">⑯ tag_facts 🆕</text><text x="220" y="348" fill="#86909C" text-anchor="middle">append-only 写入</text><text x="220" y="362" fill="#86909C" text-anchor="middle">带 prompt_version</text><rect width="120" height="60" x="300" y="310" fill="#FFF7E8" stroke="#FF7D00" stroke-width="1.5" rx="8"/><text x="360" y="332" fill="#7A4D00" font-weight="700" text-anchor="middle">⑰ tag_current 🆕</text><text x="360" y="348" fill="#86909C" text-anchor="middle">MAX(version) 物化</text><text x="360" y="362" fill="#86909C" text-anchor="middle">查询读这个</text><rect width="120" height="60" x="440" y="310" fill="#FFF7E8" stroke="#FF7D00" stroke-width="1.5" rx="8"/><text x="500" y="332" fill="#7A4D00" font-weight="700" text-anchor="middle">⑱ tag_stats 🆕</text><text x="500" y="348" fill="#86909C" text-anchor="middle">增量聚合刷新</text><text x="500" y="362" fill="#86909C" text-anchor="middle">看板读这个</text><rect width="260" height="60" x="580" y="310" fill="#FFF1F0" stroke="#F53F3F" stroke-width="1.5" rx="8"/><text x="710" y="332" fill="#A8071A" font-weight="700" text-anchor="middle">✗ MiniCPM-V 视觉 caption（砍掉）</text><text x="710" y="348" fill="#86909C" text-anchor="middle">✗ ImageBind 多模态编码（砍掉）</text><text x="710" y="362" fill="#86909C" text-anchor="middle">✗ video_segment_feature_vdb 视觉检索通道（砍掉）</text><g fill="none" stroke-width="1.5"><line x1="140" x2="160" y1="120" y2="120" stroke="#165DFF" marker-end="url(#i-arrow)"/><line x1="280" x2="300" y1="120" y2="120" stroke="#165DFF" marker-end="url(#i-arrow)"/><line x1="420" x2="440" y1="120" y2="120" stroke="#722ED1" stroke-dasharray="3 2" marker-end="url(#i-arrow)"/><line x1="560" x2="580" y1="120" y2="120" stroke="#165DFF" marker-end="url(#i-arrow)"/><line x1="700" x2="720" y1="120" y2="120" stroke="#165DFF" marker-end="url(#i-arrow)"/><line x1="840" x2="860" y1="120" y2="120" stroke="#165DFF" marker-end="url(#i-arrow)"/><path stroke="#165DFF" marker-end="url(#i-arrow)" d="M920,150 L920,180 L80,180 L80,200"/><line x1="140" x2="160" y1="230" y2="230" stroke="#165DFF" marker-end="url(#i-arrow)"/><line x1="280" x2="300" y1="230" y2="230" stroke="#FF7D00" marker-end="url(#i-arrow)"/><line x1="420" x2="440" y1="230" y2="230" stroke="#165DFF" marker-end="url(#i-arrow)"/><line x1="560" x2="580" y1="230" y2="230" stroke="#165DFF" marker-end="url(#i-arrow)"/><line x1="700" x2="720" y1="230" y2="230" stroke="#165DFF" marker-end="url(#i-arrow)"/><line x1="840" x2="860" y1="230" y2="230" stroke="#165DFF" marker-end="url(#i-arrow)"/><path stroke="#FF7D00" marker-end="url(#i-arrow)" d="M920,260 L920,290 L80,290 L80,310"/><line x1="140" x2="160" y1="340" y2="340" stroke="#FF7D00" marker-end="url(#i-arrow)"/><line x1="280" x2="300" y1="340" y2="340" stroke="#FF7D00" marker-end="url(#i-arrow)"/><line x1="420" x2="440" y1="340" y2="340" stroke="#FF7D00" marker-end="url(#i-arrow)"/></g></g><g fill="#5B1DAB" font-size="10"><text x="220" y="172" text-anchor="middle">→ Silero</text><text x="360" y="172" text-anchor="middle">→ funASR</text><text x="500" y="172" text-anchor="middle">→ CAM++</text><text x="780" y="172" text-anchor="middle">→ bge-m3</text><text x="920" y="172" text-anchor="middle">→ Qwen3.6-27B</text><text x="80" y="282" text-anchor="middle">→ bge-m3</text><text x="80" y="392" text-anchor="middle">→ Qwen3.6-35B</text></g><rect width="960" height="120" x="20" y="420" fill="#F7F8FA" stroke="#E5E6EB" rx="8"/><text x="40" y="442" fill="#1D2129" font-size="12" font-weight="700">缓存与幂等（LLM Response Cache · 借鉴 Graphify 思路）</text><text x="40" y="462" fill="#4E5969" font-size="11">· key = MD5(model, messages) — 经 functools.partial 注入 best/cheap_model_func</text><text x="40" y="480" fill="#4E5969" font-size="11">· 覆盖：实体抽取 / gleaning / query 改写 / 摘要 / 关键词 / 段过滤 / 标签判定 / 最终回答</text><text x="40" y="498" fill="#4E5969" font-size="11">· 同 prompt 重跑全命中免费；prompt 升级 → 仅 dirty 重算（version-gate）→ diff → 增量聚合</text><text x="40" y="516" fill="#F53F3F" font-size="11">⚠ Phase 4 流式时需加锁或快照机制（VideoRAG 原生非并发安全）</text></svg>