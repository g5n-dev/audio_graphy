<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="i-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#165DFF"/></marker>
    <marker id="i-arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4E5969"/></marker>
  </defs>
  <rect width="1000" height="560" fill="#FAFBFC"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#1D2129">索引数据流（Indexing Dataflow）</text>
  <text x="500" y="52" text-anchor="middle" font-size="12" fill="#86909C">绿=新增/替换 · 红=砍掉 · 蓝=保留自 VideoRAG · 紫=服务调用</text>

  <!-- 流水线节点 -->
  <g font-size="11">
    <!-- 1. 录音接入 -->
    <rect x="20" y="90" width="120" height="60" rx="8" fill="#FFF7E8" stroke="#FF7D00" stroke-width="1.5"/>
    <text x="80" y="112" text-anchor="middle" font-weight="700" fill="#1D2129">① 录音接入</text>
    <text x="80" y="128" text-anchor="middle" fill="#86909C">watchdog / 上传</text>
    <text x="80" y="142" text-anchor="middle" fill="#86909C">写 recordings 行</text>

    <!-- 2. VAD 切分 (替换) -->
    <rect x="160" y="90" width="120" height="60" rx="8" fill="#E8FFEA" stroke="#00B42A" stroke-width="1.5"/>
    <text x="220" y="112" text-anchor="middle" font-weight="700" fill="#0F7A2E">② VAD 切分 🆕</text>
    <text x="220" y="128" text-anchor="middle" fill="#86909C">Silero 检测语音段</text>
    <text x="220" y="142" text-anchor="middle" fill="#86909C">跳静音 → ASR 有效</text>

    <!-- 3. ASR 转写 (替换) -->
    <rect x="300" y="90" width="120" height="60" rx="8" fill="#E8FFEA" stroke="#00B42A" stroke-width="1.5"/>
    <text x="360" y="112" text-anchor="middle" font-weight="700" fill="#0F7A2E">③ ASR 转写 🆕</text>
    <text x="360" y="128" text-anchor="middle" fill="#86909C">funASR（中文强）</text>
    <text x="360" y="142" text-anchor="middle" fill="#86909C">每段 → transcript</text>

    <!-- 4. 可选声纹 -->
    <rect x="440" y="90" width="120" height="60" rx="8" fill="#F5E8FF" stroke="#722ED1" stroke-width="1.5" stroke-dasharray="3,2"/>
    <text x="500" y="112" text-anchor="middle" font-weight="700" fill="#5B1DAB">④ 声纹 (可选) 🆕</text>
    <text x="500" y="128" text-anchor="middle" fill="#86909C">CAM++ 说话人分离</text>
    <text x="500" y="142" text-anchor="middle" fill="#86909C">跨录音链接</text>

    <!-- 5. chunk 打包 (保留) -->
    <rect x="580" y="90" width="120" height="60" rx="8" fill="#E8F3FF" stroke="#165DFF" stroke-width="1.5"/>
    <text x="640" y="112" text-anchor="middle" font-weight="700" fill="#0E42D2">⑤ chunk 打包</text>
    <text x="640" y="128" text-anchor="middle" fill="#86909C">按 token 预算打包</text>
    <text x="640" y="142" text-anchor="middle" fill="#86909C">+ 三级溯源链</text>

    <!-- 6. 向量编码 (保留) -->
    <rect x="720" y="90" width="120" height="60" rx="8" fill="#E8F3FF" stroke="#165DFF" stroke-width="1.5"/>
    <text x="780" y="112" text-anchor="middle" font-weight="700" fill="#0E42D2">⑥ bge-m3 向量</text>
    <text x="780" y="128" text-anchor="middle" fill="#86909C">chunk → chunk_emb</text>
    <text x="780" y="142" text-anchor="middle" fill="#86909C">→ MySQL vectors</text>

    <!-- 7. 实体抽取 (保留+汉化) -->
    <rect x="860" y="90" width="120" height="60" rx="8" fill="#E8F3FF" stroke="#165DFF" stroke-width="1.5"/>
    <text x="920" y="112" text-anchor="middle" font-weight="700" fill="#0E42D2">⑦ 实体抽取</text>
    <text x="920" y="128" text-anchor="middle" fill="#86909C">中文 prompt（强 LLM）</text>
    <text x="920" y="142" text-anchor="middle" fill="#86909C">+ Gleaning 补抽</text>

    <!-- 第二行 -->
    <rect x="20" y="200" width="120" height="60" rx="8" fill="#E8F3FF" stroke="#165DFF" stroke-width="1.5"/>
    <text x="80" y="222" text-anchor="middle" font-weight="700" fill="#0E42D2">⑧ 向量编码</text>
    <text x="80" y="238" text-anchor="middle" fill="#86909C">entity → entity_emb</text>
    <text x="80" y="252" text-anchor="middle" fill="#86909C">→ MySQL vectors</text>

    <rect x="160" y="200" width="120" height="60" rx="8" fill="#E8F3FF" stroke="#165DFF" stroke-width="1.5"/>
    <text x="220" y="222" text-anchor="middle" font-weight="700" fill="#0E42D2">⑨ 图谱合并</text>
    <text x="220" y="238" text-anchor="middle" fill="#86909C">按名字去重合并</text>
    <text x="220" y="252" text-anchor="middle" fill="#86909C">类型 Counter 投票</text>

    <rect x="300" y="200" width="120" height="60" rx="8" fill="#FFF7E8" stroke="#FF7D00" stroke-width="1.5"/>
    <text x="360" y="222" text-anchor="middle" font-weight="700" fill="#7A4D00">⑩ 中文归一 🆕</text>
    <text x="360" y="238" text-anchor="middle" fill="#86909C">别名表 / 编辑距离</text>
    <text x="360" y="252" text-anchor="middle" fill="#86909C">消近重名实体</text>

    <rect x="440" y="200" width="120" height="60" rx="8" fill="#E8F3FF" stroke="#165DFF" stroke-width="1.5"/>
    <text x="500" y="222" text-anchor="middle" font-weight="700" fill="#0E42D2">⑪ 边打标</text>
    <text x="500" y="238" text-anchor="middle" fill="#86909C">借鉴 Graphify:</text>
    <text x="500" y="252" text-anchor="middle" fill="#86909C">EXTRACTED/INFERRED</text>

    <rect x="580" y="200" width="120" height="60" rx="8" fill="#E8F3FF" stroke="#165DFF" stroke-width="1.5"/>
    <text x="640" y="222" text-anchor="middle" font-weight="700" fill="#0E42D2">⑫ Leiden 社区</text>
    <text x="640" y="238" text-anchor="middle" fill="#86909C">基于图拓扑聚类</text>
    <text x="640" y="252" text-anchor="middle" fill="#86909C">无 embedding</text>

    <rect x="720" y="200" width="120" height="60" rx="8" fill="#E8F3FF" stroke="#165DFF" stroke-width="1.5"/>
    <text x="780" y="222" text-anchor="middle" font-weight="700" fill="#0E42D2">⑬ flush 落盘</text>
    <text x="780" y="238" text-anchor="middle" fill="#86909C">index_done_callback</text>
    <text x="780" y="252" text-anchor="middle" fill="#86909C">生命周期点 checkpoint</text>

    <rect x="860" y="200" width="120" height="60" rx="8" fill="#E8FFEA" stroke="#00B42A" stroke-width="1.5"/>
    <text x="920" y="222" text-anchor="middle" font-weight="700" fill="#0F7A2E">⑭ 状态回写 🆕</text>
    <text x="920" y="238" text-anchor="middle" fill="#86909C">recordings.status</text>
    <text x="920" y="252" text-anchor="middle" fill="#86909C">= indexed</text>

    <!-- 第三行：标签 -->
    <rect x="20" y="310" width="120" height="60" rx="8" fill="#FFF7E8" stroke="#FF7D00" stroke-width="1.5"/>
    <text x="80" y="332" text-anchor="middle" font-weight="700" fill="#7A4D00">⑮ 标签抽取 🆕</text>
    <text x="80" y="348" text-anchor="middle" fill="#86909C">弱 LLM 判多级标签</text>
    <text x="80" y="362" text-anchor="middle" fill="#86909C">输入 hash</text>

    <rect x="160" y="310" width="120" height="60" rx="8" fill="#FFF7E8" stroke="#FF7D00" stroke-width="1.5"/>
    <text x="220" y="332" text-anchor="middle" font-weight="700" fill="#7A4D00">⑯ tag_facts 🆕</text>
    <text x="220" y="348" text-anchor="middle" fill="#86909C">append-only 写入</text>
    <text x="220" y="362" text-anchor="middle" fill="#86909C">带 prompt_version</text>

    <rect x="300" y="310" width="120" height="60" rx="8" fill="#FFF7E8" stroke="#FF7D00" stroke-width="1.5"/>
    <text x="360" y="332" text-anchor="middle" font-weight="700" fill="#7A4D00">⑰ tag_current 🆕</text>
    <text x="360" y="348" text-anchor="middle" fill="#86909C">MAX(version) 物化</text>
    <text x="360" y="362" text-anchor="middle" fill="#86909C">查询读这个</text>

    <rect x="440" y="310" width="120" height="60" rx="8" fill="#FFF7E8" stroke="#FF7D00" stroke-width="1.5"/>
    <text x="500" y="332" text-anchor="middle" font-weight="700" fill="#7A4D00">⑱ tag_stats 🆕</text>
    <text x="500" y="348" text-anchor="middle" fill="#86909C">增量聚合刷新</text>
    <text x="500" y="362" text-anchor="middle" fill="#86909C">看板读这个</text>

    <!-- 砍掉的视觉模块 -->
    <rect x="580" y="310" width="260" height="60" rx="8" fill="#FFF1F0" stroke="#F53F3F" stroke-width="1.5"/>
    <text x="710" y="332" text-anchor="middle" font-weight="700" fill="#A8071A">✗ MiniCPM-V 视觉 caption（砍掉）</text>
    <text x="710" y="348" text-anchor="middle" fill="#86909C">✗ ImageBind 多模态编码（砍掉）</text>
    <text x="710" y="362" text-anchor="middle" fill="#86909C">✗ video_segment_feature_vdb 视觉检索通道（砍掉）</text>

    <!-- 连接箭头 第一行 -->
    <g stroke-width="1.5" fill="none">
      <line x1="140" y1="120" x2="160" y2="120" stroke="#165DFF" marker-end="url(#i-arrow)"/>
      <line x1="280" y1="120" x2="300" y2="120" stroke="#165DFF" marker-end="url(#i-arrow)"/>
      <line x1="420" y1="120" x2="440" y2="120" stroke="#722ED1" stroke-dasharray="3,2" marker-end="url(#i-arrow)"/>
      <line x1="560" y1="120" x2="580" y2="120" stroke="#165DFF" marker-end="url(#i-arrow)"/>
      <line x1="700" y1="120" x2="720" y2="120" stroke="#165DFF" marker-end="url(#i-arrow)"/>
      <line x1="840" y1="120" x2="860" y2="120" stroke="#165DFF" marker-end="url(#i-arrow)"/>
      <!-- 第一行末到第二行首 -->
      <path d="M920,150 L920,180 L80,180 L80,200" stroke="#165DFF" marker-end="url(#i-arrow)"/>
      <!-- 第二行 -->
      <line x1="140" y1="230" x2="160" y2="230" stroke="#165DFF" marker-end="url(#i-arrow)"/>
      <line x1="280" y1="230" x2="300" y2="230" stroke="#FF7D00" marker-end="url(#i-arrow)"/>
      <line x1="420" y1="230" x2="440" y2="230" stroke="#165DFF" marker-end="url(#i-arrow)"/>
      <line x1="560" y1="230" x2="580" y2="230" stroke="#165DFF" marker-end="url(#i-arrow)"/>
      <line x1="700" y1="230" x2="720" y2="230" stroke="#165DFF" marker-end="url(#i-arrow)"/>
      <line x1="840" y1="230" x2="860" y2="230" stroke="#165DFF" marker-end="url(#i-arrow)"/>
      <!-- 第二行末到第三行 -->
      <path d="M920,260 L920,290 L80,290 L80,310" stroke="#FF7D00" marker-end="url(#i-arrow)"/>
      <!-- 第三行 -->
      <line x1="140" y1="340" x2="160" y2="340" stroke="#FF7D00" marker-end="url(#i-arrow)"/>
      <line x1="280" y1="340" x2="300" y2="340" stroke="#FF7D00" marker-end="url(#i-arrow)"/>
      <line x1="420" y1="340" x2="440" y2="340" stroke="#FF7D00" marker-end="url(#i-arrow)"/>
    </g>
  </g>

  <!-- 服务调用提示 -->
  <g font-size="10" fill="#5B1DAB">
    <text x="220" y="172" text-anchor="middle">→ Silero</text>
    <text x="360" y="172" text-anchor="middle">→ funASR</text>
    <text x="500" y="172" text-anchor="middle">→ CAM++</text>
    <text x="780" y="172" text-anchor="middle">→ bge-m3</text>
    <text x="920" y="172" text-anchor="middle">→ Qwen3.6-27B</text>
    <text x="80" y="282" text-anchor="middle">→ bge-m3</text>
    <text x="80" y="392" text-anchor="middle">→ Qwen3.6-35B</text>
  </g>

  <!-- 缓存注释 -->
  <rect x="20" y="420" width="960" height="120" rx="8" fill="#F7F8FA" stroke="#E5E6EB"/>
  <text x="40" y="442" font-size="12" font-weight="700" fill="#1D2129">缓存与幂等（LLM Response Cache · 借鉴 Graphify 思路）</text>
  <text x="40" y="462" font-size="11" fill="#4E5969">· key = MD5(model, messages) — 经 functools.partial 注入 best/cheap_model_func</text>
  <text x="40" y="480" font-size="11" fill="#4E5969">· 覆盖：实体抽取 / gleaning / query 改写 / 摘要 / 关键词 / 段过滤 / 标签判定 / 最终回答</text>
  <text x="40" y="498" font-size="11" fill="#4E5969">· 同 prompt 重跑全命中免费；prompt 升级 → 仅 dirty 重算（version-gate）→ diff → 增量聚合</text>
  <text x="40" y="516" font-size="11" fill="#F53F3F">⚠ Phase 4 流式时需加锁或快照机制（VideoRAG 原生非并发安全）</text>
</svg>
