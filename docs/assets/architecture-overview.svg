<svg viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="grad-blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8F3FF"/><stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8FFEA"/><stop offset="100%" stop-color="#D1FADF"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5E8FF"/><stop offset="100%" stop-color="#EFD8FF"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF7E8"/><stop offset="100%" stop-color="#FFE4BA"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4E5969"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#165DFF"/>
    </marker>
  </defs>

  <rect width="1000" height="640" fill="#FAFBFC"/>

  <text x="500" y="32" text-anchor="middle" font-size="22" font-weight="700" fill="#1D2129">AudioGraphy · 总体架构（Overall Architecture）</text>
  <text x="500" y="54" text-anchor="middle" font-size="13" fill="#86909C">两层架构：流水线状态层（MySQL） + RAG 引擎层（文件索引），由 recording_id 桥接</text>

  <!-- 输入层 -->
  <rect x="30" y="90" width="160" height="510" rx="10" fill="url(#grad-orange)" stroke="#FF7D00" stroke-width="1.5"/>
  <text x="110" y="115" text-anchor="middle" font-size="14" font-weight="700" fill="#7A4D00">输入层 Input</text>
  <rect x="48" y="135" width="124" height="60" rx="6" fill="#FFFFFF" stroke="#FF7D00"/>
  <text x="110" y="155" text-anchor="middle" font-size="12" font-weight="600" fill="#1D2129">门店录音</text>
  <text x="110" y="172" text-anchor="middle" font-size="10" fill="#86909C">汽车销售 / 育儿咨询</text>
  <text x="110" y="186" text-anchor="middle" font-size="10" fill="#86909C">.mp3 / .wav / .m4a</text>
  <rect x="48" y="210" width="124" height="60" rx="6" fill="#FFFFFF" stroke="#FF7D00"/>
  <text x="110" y="230" text-anchor="middle" font-size="12" font-weight="600" fill="#1D2129">业务元数据</text>
  <text x="110" y="247" text-anchor="middle" font-size="10" fill="#86909C">门店 / 坐席 / 客户</text>
  <text x="110" y="261" text-anchor="middle" font-size="10" fill="#86909C">recorded_at / tenant_id</text>
  <rect x="48" y="285" width="124" height="60" rx="6" fill="#FFFFFF" stroke="#FF7D00"/>
  <text x="110" y="305" text-anchor="middle" font-size="12" font-weight="600" fill="#1D2129">人工修正</text>
  <text x="110" y="322" text-anchor="middle" font-size="10" fill="#86909C">标签/实体人工校对</text>
  <text x="110" y="336" text-anchor="middle" font-size="10" fill="#86909C">触发增量重算</text>

  <!-- 中间核心：流水线状态层 -->
  <rect x="220" y="90" width="320" height="510" rx="10" fill="url(#grad-blue)" stroke="#165DFF" stroke-width="1.5"/>
  <text x="380" y="115" text-anchor="middle" font-size="14" font-weight="700" fill="#0E42D2">流水线状态层（MySQL · 新增）</text>
  <text x="380" y="132" text-anchor="middle" font-size="10" fill="#4E5969">Pipeline State Layer — orchestration · version · audit · aggregation</text>

  <rect x="240" y="150" width="280" height="50" rx="6" fill="#FFFFFF" stroke="#165DFF"/>
  <text x="260" y="170" font-size="12" font-weight="600" fill="#1D2129">recordings</text>
  <text x="260" y="188" font-size="10" fill="#86909C">id · path · tenant_id · status · pipeline_state · created_at</text>

  <rect x="240" y="210" width="280" height="50" rx="6" fill="#FFFFFF" stroke="#165DFF"/>
  <text x="260" y="230" font-size="12" font-weight="600" fill="#1D2129">tag_facts ★（append-only, versioned）</text>
  <text x="260" y="248" font-size="10" fill="#86909C">recording_id · tag_path · value · prompt_version · input_hash</text>

  <rect x="240" y="270" width="280" height="50" rx="6" fill="#FFFFFF" stroke="#165DFF"/>
  <text x="260" y="290" font-size="12" font-weight="600" fill="#1D2129">tag_current</text>
  <text x="260" y="308" font-size="10" fill="#86909C">MAX(version) 视图（按 recording+tag_path）</text>

  <rect x="240" y="330" width="280" height="50" rx="6" fill="#FFFFFF" stroke="#165DFF"/>
  <text x="260" y="350" font-size="12" font-weight="600" fill="#1D2129">tag_stats</text>
  <text x="260" y="368" font-size="10" fill="#86909C">物化聚合（多级标签计数/分布，增量刷新）</text>

  <rect x="240" y="390" width="280" height="50" rx="6" fill="#FFFFFF" stroke="#165DFF"/>
  <text x="260" y="410" font-size="12" font-weight="600" fill="#1D2129">prompts</text>
  <text x="260" y="428" font-size="10" fill="#86909C">entity_zh · tag_* prompt_version 注册表（A/B 切换）</text>

  <rect x="240" y="450" width="280" height="50" rx="6" fill="#FFFFFF" stroke="#165DFF"/>
  <text x="260" y="470" font-size="12" font-weight="600" fill="#1D2129">vectors_mysql（Phase 1 暴力余弦）</text>
  <text x="260" y="488" font-size="10" fill="#86909C">entity_emb · chunk_emb · 10⁵–10⁶ 行，小规模够用</text>

  <rect x="240" y="510" width="280" height="50" rx="6" fill="#FFFFFF" stroke="#165DFF"/>
  <text x="260" y="530" font-size="12" font-weight="600" fill="#1D2129">tenants · users · roles</text>
  <text x="260" y="548" font-size="10" fill="#86909C">多租户隔离 + RBAC（管理员/质检员/坐席/只读）</text>

  <rect x="240" y="570" width="280" height="20" rx="6" fill="#E8F3FF" stroke="#165DFF" stroke-dasharray="3,2"/>
  <text x="380" y="584" text-anchor="middle" font-size="10" fill="#0E42D2">审计 / 重算任务队列 / LLM 调用日志</text>

  <!-- 中间核心：RAG 引擎层 -->
  <rect x="560" y="90" width="320" height="510" rx="10" fill="url(#grad-green)" stroke="#00B42A" stroke-width="1.5"/>
  <text x="720" y="115" text-anchor="middle" font-size="14" font-weight="700" fill="#0F7A2E">RAG 引擎层（文件索引 · 复用 VideoRAG）</text>
  <text x="720" y="132" text-anchor="middle" font-size="10" fill="#4E5969">RAG Engine Layer — vector · graph · chunk — index once, query many</text>

  <rect x="580" y="150" width="280" height="50" rx="6" fill="#FFFFFF" stroke="#00B42A"/>
  <text x="600" y="170" font-size="12" font-weight="600" fill="#1D2129">kv_store_llm_response_cache.json ★</text>
  <text x="600" y="188" font-size="10" fill="#86909C">MD5(model,messages) · prompt 不变重打免费</text>

  <rect x="580" y="210" width="280" height="50" rx="6" fill="#FFFFFF" stroke="#00B42A"/>
  <text x="600" y="230" font-size="12" font-weight="600" fill="#1D2129">kv_store_video_segments.json</text>
  <text x="600" y="248" font-size="10" fill="#86909C">段级 transcript · timestamp · recorded_at · speaker</text>

  <rect x="580" y="270" width="280" height="50" rx="6" fill="#FFFFFF" stroke="#00B42A"/>
  <text x="600" y="290" font-size="12" font-weight="600" fill="#1D2129">kv_store_text_chunks.json</text>
  <text x="600" y="308" font-size="10" fill="#86909C">chunk 文本 + 溯源（segment_ids[]）</text>

  <rect x="580" y="330" width="280" height="50" rx="6" fill="#FFFFFF" stroke="#00B42A"/>
  <text x="600" y="350" font-size="12" font-weight="600" fill="#1D2129">graph_chunk_entity_relation.graphml ★</text>
  <text x="600" y="368" font-size="10" fill="#86909C">NetworkX 知识图谱 · 实体/关系/社区/置信度</text>

  <rect x="580" y="390" width="280" height="50" rx="6" fill="#FFFFFF" stroke="#00B42A"/>
  <text x="600" y="410" font-size="12" font-weight="600" fill="#1D2129">vdb_entities / vdb_chunks</text>
  <text x="600" y="428" font-size="10" fill="#86909C">实体/文本块向量（Phase 1 走 MySQL）</text>

  <rect x="580" y="450" width="280" height="50" rx="6" fill="#FFFFFF" stroke="#86909C" stroke-dasharray="3,2"/>
  <text x="600" y="470" font-size="12" font-weight="600" fill="#86909C">vdb_video_segment_feature.json ✗</text>
  <text x="600" y="488" font-size="10" fill="#86909C">视觉通道（已砍） — Level 2 换 CLAP 音频嵌入</text>

  <rect x="580" y="510" width="280" height="80" rx="6" fill="#E8FFEA" stroke="#00B42A" stroke-dasharray="3,2"/>
  <text x="600" y="528" font-size="11" font-weight="600" fill="#0F7A2E">→ 可选增强 Level 2 / 3</text>
  <text x="600" y="546" font-size="10" fill="#4E5969">· CLAP 音频嵌入（替代 ImageBind 视觉）</text>
  <text x="600" y="560" font-size="10" fill="#4E5969">· CAM++ 声纹 → 跨录音说话人链接</text>
  <text x="600" y="574" font-size="10" fill="#4E5969">· Neo4j 图存储（大规模时切走 NetworkX）</text>

  <!-- 模型/服务 -->
  <rect x="910" y="90" width="80" height="510" rx="10" fill="url(#grad-purple)" stroke="#722ED1" stroke-width="1.5"/>
  <text x="950" y="115" text-anchor="middle" font-size="12" font-weight="700" fill="#5B1DAB">服务 Services</text>
  <rect x="918" y="135" width="64" height="40" rx="4" fill="#FFFFFF" stroke="#722ED1"/>
  <text x="950" y="152" text-anchor="middle" font-size="10" font-weight="600" fill="#1D2129">Silero</text>
  <text x="950" y="167" text-anchor="middle" font-size="9" fill="#86909C">VAD</text>
  <rect x="918" y="180" width="64" height="40" rx="4" fill="#FFFFFF" stroke="#722ED1"/>
  <text x="950" y="197" text-anchor="middle" font-size="10" font-weight="600" fill="#1D2129">funASR</text>
  <text x="950" y="212" text-anchor="middle" font-size="9" fill="#86909C">中文 ASR</text>
  <rect x="918" y="225" width="64" height="40" rx="4" fill="#FFFFFF" stroke="#722ED1"/>
  <text x="950" y="242" text-anchor="middle" font-size="10" font-weight="600" fill="#1D2129">vLLM</text>
  <text x="950" y="257" text-anchor="middle" font-size="9" fill="#86909C">Qwen3.6-27B</text>
  <rect x="918" y="270" width="64" height="40" rx="4" fill="#FFFFFF" stroke="#722ED1"/>
  <text x="950" y="287" text-anchor="middle" font-size="10" font-weight="600" fill="#1D2129">vLLM</text>
  <text x="950" y="302" text-anchor="middle" font-size="9" fill="#86909C">Qwen3.6-35B</text>
  <rect x="918" y="315" width="64" height="40" rx="4" fill="#FFFFFF" stroke="#722ED1"/>
  <text x="950" y="332" text-anchor="middle" font-size="10" font-weight="600" fill="#1D2129">bge-m3</text>
  <text x="950" y="347" text-anchor="middle" font-size="9" fill="#86909C">embedding</text>
  <rect x="918" y="360" width="64" height="40" rx="4" fill="#FFFFFF" stroke="#722ED1"/>
  <text x="950" y="377" text-anchor="middle" font-size="10" font-weight="600" fill="#1D2129">CLAP</text>
  <text x="950" y="392" text-anchor="middle" font-size="9" fill="#86909C">audio emb</text>
  <rect x="918" y="405" width="64" height="40" rx="4" fill="#FFFFFF" stroke="#722ED1"/>
  <text x="950" y="422" text-anchor="middle" font-size="10" font-weight="600" fill="#1D2129">CAM++</text>
  <text x="950" y="437" text-anchor="middle" font-size="9" fill="#86909C">声纹</text>
  <rect x="918" y="460" width="64" height="120" rx="4" fill="#F5E8FF" stroke="#722ED1" stroke-dasharray="3,2"/>
  <text x="950" y="478" text-anchor="middle" font-size="9" fill="#5B1DAB">OpenAI 兼容</text>
  <text x="950" y="491" text-anchor="middle" font-size="9" fill="#5B1DAB">协议接入</text>
  <text x="950" y="513" text-anchor="middle" font-size="9" fill="#5B1DAB">LLM/Emb</text>
  <text x="950" y="525" text-anchor="middle" font-size="9" fill="#5B1DAB">零代码</text>
  <text x="950" y="545" text-anchor="middle" font-size="9" fill="#5B1DAB">仅 ASR</text>
  <text x="950" y="557" text-anchor="middle" font-size="9" fill="#5B1DAB">需改一函数</text>

  <!-- 桥接线 -->
  <line x1="540" y1="380" x2="580" y2="380" stroke="#F53F3F" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="525" y="370" width="60" height="20" rx="4" fill="#FFF1F0" stroke="#F53F3F"/>
  <text x="555" y="384" text-anchor="middle" font-size="10" font-weight="700" fill="#F53F3F">recording_id</text>

  <!-- 输入到 MySQL -->
  <line x1="190" y1="200" x2="240" y2="200" stroke="#4E5969" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="190" y1="300" x2="240" y2="300" stroke="#4E5969" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="215" y="194" text-anchor="middle" font-size="9" fill="#4E5969">注册</text>
  <text x="215" y="294" text-anchor="middle" font-size="9" fill="#4E5969">触发</text>

  <!-- MySQL 到 RAG -->
  <line x1="540" y1="240" x2="580" y2="240" stroke="#165DFF" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrow-blue)"/>
  <line x1="540" y1="420" x2="580" y2="420" stroke="#165DFF" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrow-blue)"/>

  <!-- 服务连线 -->
  <line x1="910" y1="155" x2="900" y2="155" stroke="#722ED1" stroke-width="1.2" stroke-dasharray="2,2"/>
  <line x1="910" y1="200" x2="900" y2="200" stroke="#722ED1" stroke-width="1.2" stroke-dasharray="2,2"/>
  <line x1="910" y1="245" x2="900" y2="245" stroke="#722ED1" stroke-width="1.2" stroke-dasharray="2,2"/>
  <line x1="910" y1="290" x2="900" y2="290" stroke="#722ED1" stroke-width="1.2" stroke-dasharray="2,2"/>
  <line x1="910" y1="335" x2="900" y2="335" stroke="#722ED1" stroke-width="1.2" stroke-dasharray="2,2"/>

  <!-- 前端层 -->
  <rect x="220" y="615" width="660" height="20" rx="4" fill="#FFF7E8" stroke="#FF7D00"/>
  <text x="550" y="629" text-anchor="middle" font-size="11" font-weight="600" fill="#7A4D00">Frontend · React + Arco Design Web · 知识图谱浏览器（AntV G6）· 多级标签看板 · Prompt 版本管理 · 检索溯源链</text>
</svg>
