) 视图（按 recording+tag_path）</text><rect width="280" height="50" x="240" y="330" fill="#FFF" stroke="#165DFF" rx="6"/><text x="260" y="350" fill="#1D2129" font-size="12" font-weight="600">tag_stats</text><text x="260" y="368" fill="#86909C" font-size="10">物化聚合（多级标签计数/分布，增量刷新）</text><rect width="280" height="50" x="240" y="390" fill="#FFF" stroke="#165DFF" rx="6"/><text x="260" y="410" fill="#1D2129" font-size="12" font-weight="600">prompts</text><text x="260" y="428" fill="#86909C" font-size="10">entity_zh · tag_* prompt_version 注册表（A/B 切换）</text><rect width="280" height="50" x="240" y="450" fill="#FFF" stroke="#165DFF" rx="6"/><text x="260" y="470" fill="#1D2129" font-size="12" font-weight="600">vectors_mysql（Phase 1 暴力余弦）</text><text x="260" y="488" fill="#86909C" font-size="10">entity_emb · chunk_emb · 10⁵–10⁶ 行，小规模够用</text><rect width="280" height="50" x="240" y="510" fill="#FFF" stroke="#165DFF" rx="6"/><text x="260" y="530" fill="#1D2129" font-size="12" font-weight="600">tenants · users · roles</text><text x="260" y="548" fill="#86909C" font-size="10">多租户隔离 + RBAC（管理员/质检员/坐席/只读）</text><rect width="280" height="20" x="240" y="570" fill="#E8F3FF" stroke="#165DFF" stroke-dasharray="3 2" rx="6"/><text x="380" y="584" fill="#0E42D2" font-size="10" text-anchor="middle">审计 / 重算任务队列 / LLM 调用日志</text><rect width="320" height="510" x="560" y="90" fill="url(#grad-green)" stroke="#00B42A" stroke-width="1.5" rx="10"/><text x="720" y="115" fill="#0F7A2E" font-size="14" font-weight="700" text-anchor="middle">RAG 引擎层（文件索引 · 复用 VideoRAG）</text><text x="720" y="132" fill="#4E5969" font-size="10" text-anchor="middle">RAG Engine Layer — vector · graph · chunk — index once, query many</text><rect width="280" height="50" x="580" y="150" fill="#FFF" stroke="#00B42A" rx="6"/><text x="600" y="170" fill="#1D2129" font-size="12" font-weight="600">kv_store_llm_response_cache.json ★</text><text x="600" y="188" fill="#86909C" font-size="10">MD5(model,messages) · prompt 不变重打免费</text><rect wid