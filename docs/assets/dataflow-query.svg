<svg viewBox="0 0 1000 540" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="q-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#165DFF"/></marker>
    <marker id="q-arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#F53F3F"/></marker>
  </defs>
  <rect width="1000" height="540" fill="#FAFBFC"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#1D2129">查询数据流（Query Dataflow）</text>
  <text x="500" y="52" text-anchor="middle" font-size="12" fill="#86909C">四阶段流水线：双通道召回 → union → LLM 过滤 → 精化重排（视觉通道已砍）</text>

  <!-- 输入 -->
  <rect x="40" y="100" width="160" height="80" rx="8" fill="#E8F3FF" stroke="#165DFF" stroke-width="2"/>
  <text x="120" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="#0E42D2">用户问题</text>
  <text x="120" y="143" text-anchor="middle" font-size="10" fill="#86909C">"7月1-15日哪几场</text>
  <text x="120" y="157" text-anchor="middle" font-size="10" fill="#86909C">接待提了 CS75 Plus</text>
  <text x="120" y="171" text-anchor="middle" font-size="10" fill="#86909C">+ 金融政策?"</text>

  <!-- 弱 LLM 改写 -->
  <rect x="230" y="100" width="140" height="80" rx="8" fill="#F5E8FF" stroke="#722ED1" stroke-width="2"/>
  <text x="300" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="#5B1DAB">① 改写 + 关键词</text>
  <text x="300" y="143" text-anchor="middle" font-size="10" fill="#86909C">弱 LLM</text>
  <text x="300" y="157" text-anchor="middle" font-size="10" fill="#86909C">提取关键实体</text>
  <text x="300" y="171" text-anchor="middle" font-size="10" fill="#86909C">→ 命中 LLM 缓存</text>

  <line x1="200" y1="140" x2="230" y2="140" stroke="#165DFF" stroke-width="2" marker-end="url(#q-arrow)"/>

  <!-- 双通道 -->
  <rect x="400" y="80" width="170" height="60" rx="8" fill="#E8FFEA" stroke="#00B42A" stroke-width="2"/>
  <text x="485" y="103" text-anchor="middle" font-size="12" font-weight="700" fill="#0F7A2E">②a 朴素文本检索</text>
  <text x="485" y="119" text-anchor="middle" font-size="10" fill="#86909C">MySQL vectors_mysql</text>
  <text x="485" y="133" text-anchor="middle" font-size="10" fill="#86909C">暴力余弦 top-k chunk</text>

  <rect x="400" y="160" width="170" height="60" rx="8" fill="#E8FFEA" stroke="#00B42A" stroke-width="2"/>
  <text x="485" y="183" text-anchor="middle" font-size="12" font-weight="700" fill="#0F7A2E">②b 图谱检索</text>
  <text x="485" y="199" text-anchor="middle" font-size="10" fill="#86909C">实体 → 一跳邻居</text>
  <text x="485" y="213" text-anchor="middle" font-size="10" fill="#86909C">按 relation_counts 排序</text>

  <rect x="400" y="240" width="170" height="60" rx="8" fill="#FFF1F0" stroke="#F53F3F" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="485" y="263" text-anchor="middle" font-size="12" font-weight="700" fill="#A8071A">✗ 视觉检索通道</text>
  <text x="485" y="279" text-anchor="middle" font-size="10" fill="#A8071A">已砍 — Level 2 换 CLAP</text>
  <text x="485" y="293" text-anchor="middle" font-size="10" fill="#A8071A">音频嵌入（副语言）</text>

  <line x1="370" y1="110" x2="400" y2="110" stroke="#165DFF" stroke-width="2" marker-end="url(#q-arrow)"/>
  <line x1="370" y1="170" x2="400" y2="190" stroke="#165DFF" stroke-width="2" marker-end="url(#q-arrow)"/>

  <!-- 时间过滤 -->
  <rect x="400" y="320" width="170" height="50" rx="8" fill="#FFF7E8" stroke="#FF7D00" stroke-width="1.5"/>
  <text x="485" y="340" text-anchor="middle" font-size="12" font-weight="700" fill="#7A4D00">②c 时间过滤 🆕</text>
  <text x="485" y="358" text-anchor="middle" font-size="10" fill="#86909C">recorded_at 范围筛</text>
  <line x1="370" y1="225" x2="400" y2="345" stroke="#FF7D00" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#q-arrow)"/>

  <!-- Union 合并 -->
  <rect x="610" y="190" width="120" height="80" rx="8" fill="#E8F3FF" stroke="#165DFF" stroke-width="2"/>
  <text x="670" y="215" text-anchor="middle" font-size="13" font-weight="700" fill="#0E42D2">③ Union 合并</text>
  <text x="670" y="233" text-anchor="middle" font-size="10" fill="#86909C">去重</text>
  <text x="670" y="247" text-anchor="middle" font-size="10" fill="#86909C">按 recorded_at 排序</text>
  <text x="670" y="261" text-anchor="middle" font-size="10" fill="#86909C">保留 source_id 溯源</text>

  <line x1="570" y1="110" x2="610" y2="210" stroke="#165DFF" stroke-width="2" marker-end="url(#q-arrow)"/>
  <line x1="570" y1="190" x2="610" y2="225" stroke="#165DFF" stroke-width="2" marker-end="url(#q-arrow)"/>
  <line x1="570" y1="345" x2="610" y2="260" stroke="#FF7D00" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#q-arrow)"/>

  <!-- LLM 过滤 -->
  <rect x="760" y="100" width="120" height="80" rx="8" fill="#F5E8FF" stroke="#722ED1" stroke-width="2"/>
  <text x="820" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="#5B1DAB">④ LLM 过滤</text>
  <text x="820" y="143" text-anchor="middle" font-size="10" fill="#86909C">强 LLM as-judge</text>
  <text x="820" y="157" text-anchor="middle" font-size="10" fill="#86909C">逐段 yes/no 相关</text>
  <text x="820" y="171" text-anchor="middle" font-size="10" fill="#86909C">去语义无关段</text>

  <line x1="730" y1="220" x2="760" y2="160" stroke="#722ED1" stroke-width="2" stroke-dasharray="4,2" marker-end="url(#q-arrow)"/>

  <!-- 精化重排 -->
  <rect x="760" y="200" width="220" height="80" rx="8" fill="#F5E8FF" stroke="#722ED1" stroke-width="2"/>
  <text x="870" y="225" text-anchor="middle" font-size="13" font-weight="700" fill="#5B1DAB">⑤ 精化重排</text>
  <text x="870" y="243" text-anchor="middle" font-size="10" fill="#86909C">高精度重转写（替代重新抽帧）</text>
  <text x="870" y="257" text-anchor="middle" font-size="10" fill="#86909C">粗描述 → 查询导向精描述</text>
  <text x="870" y="271" text-anchor="middle" font-size="10" fill="#86909C">+ relation_counts 结构信号重排</text>

  <line x1="820" y1="180" x2="820" y2="200" stroke="#165DFF" stroke-width="2" marker-end="url(#q-arrow)"/>

  <!-- 最终回答 -->
  <rect x="760" y="300" width="220" height="80" rx="8" fill="#E8F3FF" stroke="#165DFF" stroke-width="2"/>
  <text x="870" y="325" text-anchor="middle" font-size="13" font-weight="700" fill="#0E42D2">⑥ 最终回答</text>
  <text x="870" y="343" text-anchor="middle" font-size="10" fill="#86909C">强 LLM 综合生成</text>
  <text x="870" y="357" text-anchor="middle" font-size="10" fill="#86909C">三级溯源链引用时间段</text>
  <text x="870" y="371" text-anchor="middle" font-size="10" fill="#86909C">（实体→chunk→segment）</text>

  <line x1="870" y1="280" x2="870" y2="300" stroke="#165DFF" stroke-width="2" marker-end="url(#q-arrow)"/>

  <!-- 前端溯源链可视化 -->
  <rect x="40" y="400" width="940" height="120" rx="8" fill="#FFF7E8" stroke="#FF7D00" stroke-width="1.5"/>
  <text x="60" y="422" font-size="12" font-weight="700" fill="#7A4D00">前端可视化（React + Arco + AntV G6）</text>
  <text x="60" y="442" font-size="11" fill="#4E5969">· 检索溯源链：横向 timeline + 卡片（点击实体 → 跳图谱浏览器 → 高亮 1-hop 邻居）</text>
  <text x="60" y="460" font-size="11" fill="#4E5969">· 图谱浏览器：节点点击 → 右侧 EntityPropertyPanel（属性 + source_id + recorded_at + confidence 标签）</text>
  <text x="60" y="478" font-size="11" fill="#4E5969">· 借鉴 Graphify：节点画布 + 双搜索框（关键词 + 实体定位）+ Leiden 社区着色 + 边 confidence 染色</text>
  <text x="60" y="496" font-size="11" fill="#4E5969">· 时间范围 DatePicker（recorded_at 过滤）+ 按 recording 钻取（高亮该录音子图）</text>
  <text x="60" y="514" font-size="11" fill="#F53F3F">⚠ 大规模（节点 &gt; 2000）开 LOD：聚类合并显示 + Web Worker 布局</text>
</svg>
