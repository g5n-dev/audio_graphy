<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" viewBox="0 0 1000 540"><defs><marker id="q-arrow" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#165DFF" d="M0,0 L10,5 L0,10 z"/></marker><marker id="q-arrow-red" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#F53F3F" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect width="1000" height="540" fill="#FAFBFC"/><text x="500" y="32" fill="#1D2129" font-size="20" font-weight="700" text-anchor="middle">查询数据流（Query Dataflow）</text><text x="500" y="52" fill="#86909C" font-size="12" text-anchor="middle">四阶段流水线：双通道召回 → union → LLM 过滤 → 精化重排（视觉通道已砍）</text><rect width="160" height="80" x="40" y="100" fill="#E8F3FF" stroke="#165DFF" stroke-width="2" rx="8"/><text x="120" y="125" fill="#0E42D2" font-size="13" font-weight="700" text-anchor="middle">用户问题</text><text x="120" y="143" fill="#86909C" font-size="10" text-anchor="middle">&quot;7月1-15日哪几场</text><text x="120" y="157" fill="#86909C" font-size="10" text-anchor="middle">接待提了 CS75 Plus</text><text x="120" y="171" fill="#86909C" font-size="10" text-anchor="middle">+ 金融政策?&quot;</text><rect width="140" height="80" x="230" y="100" fill="#F5E8FF" stroke="#722ED1" stroke-width="2" rx="8"/><text x="300" y="125" fill="#5B1DAB" font-size="13" font-weight="700" text-anchor="middle">① 改写 + 关键词</text><text x="300" y="143" fill="#86909C" font-size="10" text-anchor="middle">弱 LLM</text><text x="300" y="157" fill="#86909C" font-size="10" text-anchor="middle">提取关键实体</text><text x="300" y="171" fill="#86909C" font-size="10" text-anchor="middle">→ 命中 LLM 缓存</text><line x1="200" x2="230" y1="140" y2="140" stroke="#165DFF" stroke-width="2" marker-end="url(#q-arrow)"/><rect width="170" height="60" x="400" y="80" fill="#E8FFEA" stroke="#00B42A" stroke-width="2" rx="8"/><text x="485" y="103" fill="#0F7A2E" font-size="12" font-weight="700" text-anchor="middle">②a 朴素文本检索</text><text x="485" y="119" fill="#86909C" font-size="10" text-anchor="middle">MySQL vectors_mysql</text><text x="485" y="133" fill="#86909C" font-size="10" text-anchor="middle">暴力余弦 top-k chunk</text><rect width="170" height="60" x="400" y="160" fill="#E8FFEA" stroke="#00B42A" stroke-width="2" rx="8"/><text x="485" y="183" fill="#0F7A2E" font-size="12" font-weight="700" text-anchor="middle">②b 图谱检索</text><text x="485" y="199" fill="#86909C" font-size="10" text-anchor="middle">实体 → 一跳邻居</text><text x="485" y="213" fill="#86909C" font-size="10" text-anchor="middle">按 relation_counts 排序</text><rect width="170" height="60" x="400" y="240" fill="#FFF1F0" stroke="#F53F3F" stroke-dasharray="4 3" stroke-width="1.5" rx="8"/><text x="485" y="263" fill="#A8071A" font-size="12" font-weight="700" text-anchor="middle">✗ 视觉检索通道</text><text x="485" y="279" fill="#A8071A" font-size="10" text-anchor="middle">已砍 — Level 2 换 CLAP</text><text x="485" y="293" fill="#A8071A" font-size="10" text-anchor="middle">音频嵌入（副语言）</text><line x1="370" x2="400" y1="110" y2="110" stroke="#165DFF" stroke-width="2" marker-end="url(#q-arrow)"/><line x1="370" x2="400" y1="170" y2="190" stroke="#165DFF" stroke-width="2" marker-end="url(#q-arrow)"/><rect width="170" height="50" x="400" y="320" fill="#FFF7E8" stroke="#FF7D00" stroke-width="1.5" rx="8"/><text x="485" y="340" fill="#7A4D00" font-size="12" font-weight="700" text-anchor="middle">②c 时间过滤 🆕</text><text x="485" y="358" fill="#86909C" font-size="10" text-anchor="middle">recorded_at 范围筛</text><line x1="370" x2="400" y1="225" y2="345" stroke="#FF7D00" stroke-dasharray="3 2" stroke-width="1.5" marker-end="url(#q-arrow)"/><rect width="120" height="80" x="610" y="190" fill="#E8F3FF" stroke="#165DFF" stroke-width="2" rx="8"/><text x="670" y="215" fill="#0E42D2" font-size="13" font-weight="700" text-anchor="middle">③ Union 合并</text><text x="670" y="233" fill="#86909C" font-size="10" text-anchor="middle">去重</text><text x="670" y="247" fill="#86909C" font-size="10" text-anchor="middle">按 recorded_at 排序</text><text x="670" y="261" fill="#86909C" font-size="10" text-anchor="middle">保留 source_id 溯源</text><line x1="570" x2="610" y1="110" y2="210" stroke="#165DFF" stroke-width="2" marker-end="url(#q-arrow)"/><line x1="570" x2="610" y1="190" y2="225" stroke="#165DFF" stroke-width="2" marker-end="url(#q-arrow)"/><line x1="570" x2="610" y1="345" y2="260" stroke="#FF7D00" stroke-dasharray="3 2" stroke-width="1.5" marker-end="url(#q-arrow)"/><rect width="120" height="80" x="760" y="100" fill="#F5E8FF" stroke="#722ED1" stroke-width="2" rx="8"/><text x="820" y="125" fill="#5B1DAB" font-size="13" font-weight="700" text-anchor="middle">④ LLM 过滤</text><text x="820" y="143" fill="#86909C" font-size="10" text-anchor="middle">强 LLM as-judge</text><text x="820" y="157" fill="#86909C" font-size="10" text-anchor="middle">逐段 yes/no 相关</text><text x="820" y="171" fill="#86909C" font-size="10" text-anchor="middle">去语义无关段</text><line x1="730" x2="760" y1="220" y2="160" stroke="#722ED1" stroke-dasharray="4 2" stroke-width="2" marker-end="url(#q-arrow)"/><rect width="220" height="80" x="760" y="200" fill="#F5E8FF" stroke="#722ED1" stroke-width="2" rx="8"/><text x="870" y="225" fill="#5B1DAB" font-size="13" font-weight="700" text-anchor="middle">⑤ 精化重排</text><text x="870" y="243" fill="#86909C" font-size="10" text-anchor="middle">高精度重转写（替代重新抽帧）</text><text x="870" y="257" fill="#86909C" font-size="10" text-anchor="middle">粗描述 → 查询导向精描述</text><text x="870" y="271" fill="#86909C" font-size="10" text-anchor="middle">+ relation_counts 结构信号重排</text><line x1="820" x2="820" y1="180" y2="200" stroke="#165DFF" stroke-width="2" marker-end="url(#q-arrow)"/><rect width="220" height="80" x="760" y="300" fill="#E8F3FF" stroke="#165DFF" stroke-width="2" rx="8"/><text x="870" y="325" fill="#0E42D2" font-size="13" font-weight="700" text-anchor="middle">⑥ 最终回答</text><text x="870" y="343" fill="#86909C" font-size="10" text-anchor="middle">强 LLM 综合生成</text><text x="870" y="357" fill="#86909C" font-size="10" text-anchor="middle">三级溯源链引用时间段</text><text x="870" y="371" fill="#86909C" font-size="10" text-anchor="middle">（实体→chunk→segment）</text><line x1="870" x2="870" y1="280" y2="300" stroke="#165DFF" stroke-width="2" marker-end="url(#q-arrow)"/><rect width="940" height="120" x="40" y="400" fill="#FFF7E8" stroke="#FF7D00" stroke-width="1.5" rx="8"/><text x="60" y="422" fill="#7A4D00" font-size="12" font-weight="700">前端可视化（React + Arco + AntV G6）</text><text x="60" y="442" fill="#4E5969" font-size="11">· 检索溯源链：横向 timeline + 卡片（点击实体 → 跳图谱浏览器 → 高亮 1-hop 邻居）</text><text x="60" y="460" fill="#4E5969" font-size="11">· 图谱浏览器：节点点击 → 右侧 EntityPropertyPanel（属性 + source_id + recorded_at + confidence 标签）</text><text x="60" y="478" fill="#4E5969" font-size="11">· 借鉴 Graphify：节点画布 + 双搜索框（关键词 + 实体定位）+ Leiden 社区着色 + 边 confidence 染色</text><text x="60" y="496" fill="#4E5969" font-size="11">· 时间范围 DatePicker（recorded_at 过滤）+ 按 recording 钻取（高亮该录音子图）</text><text x="60" y="514" fill="#F53F3F" font-size="11">⚠ 大规模（节点 &gt; 2000）开 LOD：聚类合并显示 + Web Worker 布局</text></svg>