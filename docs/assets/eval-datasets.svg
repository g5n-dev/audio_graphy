<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" viewBox="0 0 1000 620"><defs><marker id="d-arrow" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#165DFF" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect width="1000" height="620" fill="#FAFBFC"/><text x="500" y="32" fill="#1D2129" font-size="20" font-weight="700" text-anchor="middle">开源中文语音测试集选型（OSS Chinese Speech Testsets）</text><text x="500" y="52" fill="#86909C" font-size="12" text-anchor="middle">按 AudioRAG 评估维度（ASR / Diarization / 声纹 / 实体抽取）映射 · 标 ★ 为强烈推荐</text><text x="40" y="92" fill="#1D2129" font-size="13" font-weight="700">AudioRAG 评估能力</text><rect width="920" height="48" x="40" y="105" fill="#F5E8FF" stroke="#722ED1" rx="8"/><g font-size="11"><rect width="170" height="28" x="55" y="115" fill="#FFF" stroke="#722ED1" rx="4"/><text x="140" y="133" fill="#5B1DAB" font-weight="700" text-anchor="middle">ASR CER（中文准确率）</text><rect width="170" height="28" x="240" y="115" fill="#FFF" stroke="#722ED1" rx="4"/><text x="325" y="133" fill="#5B1DAB" font-weight="700" text-anchor="middle">说话人分离 DER</text><rect width="170" height="28" x="425" y="115" fill="#FFF" stroke="#722ED1" rx="4"/><text x="510" y="133" fill="#5B1DAB" font-weight="700" text-anchor="middle">声纹 EER（跨录音链接）</text><rect width="170" height="28" x="610" y="115" fill="#FFF" stroke="#722ED1" rx="4"/><text x="695" y="133" fill="#5B1DAB" font-weight="700" text-anchor="middle">实体抽取 P/R/F1（下游）</text><rect width="150" height="28" x="795" y="115" fill="#FFF" stroke="#722ED1" rx="4"/><text x="870" y="133" fill="#5B1DAB" font-weight="700" text-anchor="middle">中英混读 / 方言</text></g><text x="40" y="180" fill="#1D2129" font-size="13" font-weight="700">推荐开源测试集（按推荐度排序）</text><rect width="920" height="75" x="40" y="195" fill="#E8FFEA" stroke="#00B42A" stroke-width="2" rx="8"/><text x="55" y="216" fill="#0F7A2E" font-size="14" font-weight="700">★ AliMeeting (SLR119) · 强烈推荐</text><text x="55" y="234" fill="#4E5969" font-size="11">118.75h · 阿里 · ICASSP 2022 M2MeT · CC BY-SA 4.0</text><text x="55" y="251" fill="#4E5969" font-size="11">场景：真实中文多人会议，2-4 说话人重叠 42%，远场 8-ch 麦阵列 + 近场耳机，13 个会议室 8-55m²，RT60 0.3-0.6s</text><text x="55" y="265" fill="#0E42D2" font-size="11"><tspan font-weight="700">→ 用途：</tspan> ASR CER + 说话人 DER（最贴近门店录音&quot;坐席+客户&quot;对话）· Phase 2/3 评估首选</text><text x="800" y="216" fill="#0F7A2E" font-size="10" font-weight="700">★★★★★</text><text x="800" y="234" fill="#4E5969" font-size="10">匹配度：极高</text><rect width="920" height="65" x="40" y="280" fill="#E8F3FF" stroke="#165DFF" stroke-width="1.5" rx="8"/><text x="55" y="301" fill="#0E42D2" font-size="14" font-weight="700">★ AISHELL-4</text><text x="55" y="319" fill="#4E5969" font-size="11">~120h · 希尔贝壳 · CC BY-NC-ND 4.0 · 8 通道会议</text><text x="55" y="335" fill="#4E5969" font-size="11">场景：真实会议录制，含重叠语音、自发口语，与 AliMeeting 互补（不同录制风格）</text><text x="55" y="350" fill="#0E42D2" font-size="11"><tspan font-weight="700">→ 用途：</tspan> 评估 ASR/DER 在不同声学条件下的鲁棒性，作为 AliMeeting 的对照</text><text x="800" y="301" fill="#0E42D2" font-size="10" font-weight="700">★★★★</text><text x="800" y="319" fill="#4E5969" font-size="10">匹配度：高</text><rect width="450" height="75" x="40" y="355" fill="#FFF7E8" stroke="#FF7D00" stroke-width="1.5" rx="8"/><text x="55" y="376" fill="#7A4D00" font-size="14" font-weight="700">★ WenetSpeech · test_meeting / test_net</text><text x="55" y="394" fill="#4E5969" font-size="11">22,195 段 · 西工大/wenet · CC BY 4.0</text><text x="55" y="411" fill="#4E5969" font-size="11">来源 YouTube + Podcast，10 个领域（含 talk/interview）</text><text x="55" y="425" fill="#0E42D2" font-size="11"><tspan font-weight="700">→ 用途：</tspan> ASR CER 基线（互联网/会议两域）</text><text x="380" y="376" fill="#FF7D00" font-size="10" font-weight="700">★★★★</text><rect width="450" height="75" x="510" y="355" fill="#FFF7E8" stroke="#FF7D00" stroke-width="1.5" rx="8"/><text x="525" y="376" fill="#7A4D00" font-size="14" font-weight="700">AISHELL-1 / AISHELL-2</text><text x="525" y="394" fill="#4E5969" font-size="11">AISHELL-1: 178h 朗读 · AISHELL-2: 1000h iOS 录制</text><text x="525" y="411" fill="#4E5969" font-size="11">CC BY-NC-ND 4.0 · 安静室内环境</text><text x="525" y="425" fill="#0E42D2" font-size="11"><tspan font-weight="700">→ 用途：</tspan> ASR CER 朗读基线（验证 funASR 在干净音频上限）</text><text x="840" y="376" fill="#FF7D00" font-size="10" font-weight="700">★★★</text><rect width="450" height="75" x="40" y="440" fill="#F5E8FF" stroke="#722ED1" stroke-width="1.5" rx="8"/><text x="55" y="461" fill="#5B1DAB" font-size="14" font-weight="700">MagicData RAMC</text><text x="55" y="479" fill="#4E5969" font-size="11">23012 测试句 · CC BY-NC-ND</text><text x="55" y="496" fill="#4E5969" font-size="11">真实对话场景（移动端）· 含打断/重复</text><text x="55" y="510" fill="#0E42D2" font-size="11"><tspan font-weight="700">→ 用途：</tspan> ASR CER 对话场景（比朗读更贴近门店）</text><text x="380" y="461" fill="#5B1DAB" font-size="10" font-weight="700">★★★</text><rect width="450" height="75" x="510" y="440" fill="#F5E8FF" stroke="#722ED1" stroke-width="1.5" rx="8"/><text x="525" y="461" fill="#5B1DAB" font-size="14" font-weight="700">CN-Celeb · 声纹专用</text><text x="525" y="479" fill="#4E5969" font-size="11">~130h · 3000 说话人 · CC BY-NC 4.0</text><text x="525" y="496" fill="#4E5969" font-size="11">中文名人声纹，含不同录制环境/年龄/性别</text><text x="525" y="510" fill="#0E42D2" font-size="11"><tspan font-weight="700">→ 用途：</tspan> 声纹 EER 评估 · Phase 2 CAM++ 跨录音链接基线</text><text x="840" y="461" fill="#5B1DAB" font-size="10" font-weight="700">★★★</text><rect width="920" height="80" x="40" y="525" fill="#FFF1F0" stroke="#F53F3F" stroke-dasharray="3 2" stroke-width="1.5" rx="8"/><text x="55" y="546" fill="#A8071A" font-size="14" font-weight="700">补充场景测试集（按需引入）</text><text x="55" y="564" fill="#4E5969" font-size="11">· <tspan font-weight="700">TAL_CSASR</tspan>（学而思）— 中英混读，评估&quot;CS75 Plus&quot;&quot;Model Y&quot;等中英夹杂识别</text><text x="55" y="581" fill="#4E5969" font-size="11">· <tspan font-weight="700">KeSpeech</tspan>（19723 句）— 8 大官话区方言，门店坐席/客户跨区域口音评估</text><text x="55" y="598" fill="#4E5969" font-size="11">· <tspan font-weight="700">自建门店金标集</tspan>（30-50 chunk）— 真实门店录音人工标注，最贴近业务但成本高 · 用作 A1 黄金集</text></svg>