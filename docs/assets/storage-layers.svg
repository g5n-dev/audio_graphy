<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" viewBox="0 0 1000 560"><rect width="1000" height="560" fill="#FAFBFC"/><text x="500" y="32" fill="#1D2129" font-size="20" font-weight="700" text-anchor="middle">存储分层（Storage Layers）</text><text x="500" y="52" fill="#86909C" font-size="12" text-anchor="middle">VideoRAG 文件索引（复用） + MySQL 状态层（新增） + BaseStorage 抽象让三类存储可插拔</text><rect width="940" height="80" x="30" y="80" fill="#F5E8FF" stroke="#722ED1" stroke-width="1.5" rx="8"/><text x="500" y="103" fill="#5B1DAB" font-size="13" font-weight="700" text-anchor="middle">BaseStorage 抽象层（VideoRAG 提供，AudioRAG 直接复用）</text><rect width="280" height="35" x="60" y="115" fill="#FFF" stroke="#722ED1" rx="4"/><text x="200" y="138" fill="#1D2129" font-size="11" font-weight="600" text-anchor="middle">BaseKVStorage（字典语义）</text><rect width="280" height="35" x="360" y="115" fill="#FFF" stroke="#722ED1" rx="4"/><text x="500" y="138" fill="#1D2129" font-size="11" font-weight="600" text-anchor="middle">BaseVectorStorage（ANN 语义）</text><rect width="280" height="35" x="660" y="115" fill="#FFF" stroke="#722ED1" rx="4"/><text x="800" y="138" fill="#1D2129" font-size="11" font-weight="600" text-anchor="middle">BaseGraphStorage（图遍历语义）</text><rect width="460" height="350" x="30" y="180" fill="#E8F3FF" stroke="#165DFF" stroke-width="2" rx="8"/><text x="260" y="203" fill="#0E42D2" font-size="14" font-weight="700" text-anchor="middle">MySQL 状态层（新增）</text><text x="260" y="220" fill="#4E5969" font-size="10" text-anchor="middle">orchestration · version · audit · aggregation · vectors (Phase 1)</text><rect width="200" height="55" x="50" y="235" fill="#FFF" stroke="#165DFF" rx="4"/><text x="60" y="252" fill="#1D2129" font-size="11" font-weight="700">recordings</text><text x="60" y="267" fill="#86909C" font-family="ui-monospace, Menlo, monospace" font-size="9">id·path·tenant_id·status</text><text x="60" y="280" fill="#86909C" font-family="ui-monospace, Menlo, monospace" font-size="9">pipeline_state·recorded_at</text><rect width="220" height="55" x="260" y="235" fill="#FFF" stroke="#165DFF" rx="4"/><text x="270" y="252" fill="#1D2129" font-size="11" font-weight="700">segments</text><text x="270" y="267" fill="#86909C" font-family="ui-monospace, Menlo, monospace" font-size="9">id·recording_id·idx·start·end</text><text x="270" y="280" fill="#86909C" font-family="ui-monospace, Menlo, monospace" font-size="9">transcript·speaker·vad_conf</text><rect width="200" height="55" x="50" y="300" fill="#FFF" stroke="#165DFF" rx="4"/><text x="60" y="317" fill="#1D2129" font-size="11" font-weight="700">chunks</text><text x="60" y="332" fill="#86909C" font-family="ui-monospace, Menlo, monospace" font-size="9">id·segment_ids[]·text·token_n</text><text x="60" y="345" fill="#86909C" font-family="ui-monospace, Menlo, monospace" font-size="9">content_hash（去重）</text><rect width="220" height="55" x="260" y="300" fill="#FFF1F0" stroke="#F53F3F" rx="4"/><text x="270" y="317" fill="#A8071A" font-size="11" font-weight="700">tag_facts ★</text><text x="270" y="332" fill="#86909C" font-family="ui-monospace, Menlo, monospace" font-size="9">rec_id·tag_path·value·version</text><text x="270" y="345" fill="#86909C" font-family="ui-monospace, Menlo, monospace" font-size="9">prompt_version·input_hash·src</text><rect width="200" height="55" x="50" y="365" fill="#E8FFEA" stroke="#00B42A" rx="4"/><text x="60" y="382" fill="#0F7A2E" font-size="11" font-weight="700">tag_current（视图）</text><text x="60" y="397" fill="#86909C" font-size="9">SELECT MAX(version) GROUP BY</text><text x="60" y="410" fill="#86909C" font-size="9">(recording_id, tag_path)</text><rect width="220" height="55" x="260" y="365" fill="#E8FFEA" stroke="#00B42A" rx="4"/><text x="270" y="382" fill="#0F7A2E" font-size="11" font-weight="700">tag_stats（物化）</text><text x="270" y="397" fill="#86909C" font-family="ui-monospace, Menlo, monospace" font-size="9">tenant·store·tag_path·value·cnt</text><text x="270" y="410" fill="#86909C" font-size="9">增量 delta 刷新</text><rect width="430" height="40" x="50" y="430" fill="#FFF7E8" stroke="#FF7D00" rx="4"/><text x="60" y="447" fill="#7A4D00" font-size="11" font-weight="700">vectors_mysql（Phase 1 暴力余弦）</text><text x="60" y="462" fill="#86909C" font-family="ui-monospace, Menlo, monospace" font-size="9">entity_emb / chunk_emb · 10⁵-10⁶ 行 · 小规模与 NanoVectorDB 等价</text><rect width="430" height="40" x="50" y="480" fill="#F7F8FA" stroke="#E5E6EB" rx="4"/><text x="60" y="497" fill="#1D2129" font-size="10" font-weight="700">tenants · users · roles · prompts · audit_logs · llm_call_logs</text><text x="60" y="512" fill="#86909C" font-size="9">多租户 RBAC · prompt_version 注册 · 审计</text><rect width="460" height="350" x="510" y="180" fill="#E8FFEA" stroke="#00B42A" stroke-width="2" rx="8"/><text x="740" y="203" fill="#0F7A2E" font-size="14" font-weight="700" text-anchor="middle">VideoRAG 文件索引（复用）</text><text x="740" y="220" fill="#4E5969" font-size="10" text-anchor="middle">working_dir 持久化 · index_done_callback flush · 跨次复用</text><rect width="200" height="50" x="530" y="235" fill="#FFF" stroke="#00B42A" rx="4"/><text x="540" y="252" fill="#1D2129" font-family="ui-monospace, Menlo, monospace" font-size="10" font-weight="700">kv_store_video_path.json</text><text x="540" y="268" fill="#86909C" font-size="9">recording → path 映射</text><text x="540" y="280" fill="#86909C" font-size="9">去重依据</text><rect width="220" height="50" x="740" y="235" fill="#FFF" stroke="#00B42A" rx="4"/><text x="750" y="252" fill="#1D2129" font-family="ui-monospace, Menlo, monospace" font-size="10" font-weight="700">kv_store_video_segments.json</text><text x="750" y="268" fill="#86909C" font-size="9">段级 transcript·timestamp</text><text x="750" y="280" fill="#86909C" font-size="9">·recorded_at·speaker</text><rect width="200" height="50" x="530" y="295" fill="#FFF" stroke="#00B42A" rx="4"/><text x="540" y="312" fill="#1D2129" font-family="ui-monospace, Menlo, monospace" font-size="10" font-weight="700">kv_store_text_chunks.json</text><text x="540" y="328" fill="#86909C" font-size="9">chunk 文本 + 溯源</text><text x="540" y="340" fill="#86909C" font-size="9">segment_ids[]</text><rect width="220" height="50" x="740" y="295" fill="#FFF1F0" stroke="#F53F3F" stroke-width="1.5" rx="4"/><text x="750" y="312" fill="#A8071A" font-family="ui-monospace, Menlo, monospace" font-size="10" font-weight="700">kv_store_llm_response_cache ★</text><text x="750" y="328" fill="#A8071A" font-size="9">MD5(model,messages)</text><text x="750" y="340" fill="#A8071A" font-size="9">prompt 不变重打免费</text><rect width="430" height="50" x="530" y="355" fill="#FFF" stroke="#00B42A" rx="4"/><text x="540" y="372" fill="#1D2129" font-family="ui-monospace, Menlo, monospace" font-size="10" font-weight="700">graph_chunk_entity_relation.graphml ★</text><text x="540" y="388" fill="#86909C" font-size="9">NetworkX 知识图谱 · 实体/关系/社区</text><text x="540" y="400" fill="#86909C" font-size="9">+ confidence（EXTRACTED/INFERRED，借鉴 Graphify）</text><rect width="200" height="50" x="530" y="415" fill="#F7F8FA" stroke="#E5E6EB" rx="4"/><text x="540" y="432" fill="#1D2129" font-family="ui-monospace, Menlo, monospace" font-size="10" font-weight="700">vdb_entities / vdb_chunks</text><text x="540" y="448" fill="#86909C" font-size="9">Phase 1 走 MySQL（同义）</text><text x="540" y="460" fill="#86909C" font-size="9">Phase 3 可切 NanoVectorDB/HNSW</text><rect width="220" height="50" x="740" y="415" fill="#FFF1F0" stroke="#F53F3F" stroke-dasharray="3 2" stroke-width="1.5" rx="4"/><text x="750" y="432" fill="#A8071A" font-family="ui-monospace, Menlo, monospace" font-size="10" font-weight="700">vdb_video_segment_feature.json ✗</text><text x="750" y="448" fill="#A8071A" font-size="9">视觉检索通道（砍掉）</text><text x="750" y="460" fill="#A8071A" font-size="9">Level 2 → CLAP 音频嵌入</text><rect width="430" height="45" x="530" y="475" fill="#FFF7E8" stroke="#FF7D00" rx="4"/><text x="540" y="492" fill="#7A4D00" font-size="10" font-weight="700">⚠ 必须 fixed working_dir 才能跨次复用索引</text><text x="540" y="508" fill="#86909C" font-size="9">默认每次新建时间戳目录不复用；固定后 insert_video 按 video_name 跨次去重生效</text><rect width="940" height="0" x="30" y="540" fill="none" rx="0"/></svg>