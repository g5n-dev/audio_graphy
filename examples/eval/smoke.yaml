# AudioGraphy M5 Evaluation Smoke Gold Set
#
# 10 realistic store-recording scenarios covering:
# - Easy retrieval (perfect top-k)
# - Hard retrieval (partial / missing chunks)
# - Entity-heavy / Edge-heavy / Tag-heavy
# - Empty gold (denominator-zero code path)
# - Empty pred (worst-case pipeline output)
# - Multi-tenant (metadata.tenant)
#
# Schema: see docs/m5-eval.md (T8) and `audio_graphy/eval/types.py`.

# 1. Easy: perfect retrieval, full entity/edge/tag coverage.
- query: "CS75 Plus 七月优惠多少？"
  gold_answer: "5 万元现金优惠 + 2 年免息分期。"
  gold_context_ids: ["chunk-001", "chunk-004"]
  gold_entities:
    - ["CS75 Plus", "车型"]
    - ["5万", "价格方案"]
    - ["2年免息", "金融方案"]
  gold_edges:
    - ["坐席", "推荐", "CS75 Plus", "EXTRACTED"]
    - ["CS75 Plus", "搭配", "2年免息", "INFERRED"]
  gold_tags:
    - {tag_path: "接待.价格.优惠", value: "5万"}
    - {tag_path: "接待.金融.免息", value: "2年"}
  recording_id: "rec-2026-07-15-001"
  metadata: {scenario: "sales", tenant: "default"}

